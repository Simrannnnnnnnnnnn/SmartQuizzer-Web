<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scholar's Vault | SmartQuizzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- PREMIUM FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --primary:#f4b400;
    --primary-dark:#d89d00;
    --blue:#3498db;
    --dark:#07111f;
    --dark2:#0d1b2e;
    --soft:#edf3fb;
    --card:#ffffff;
    --gold:#f1c40f;

    --legendary:linear-gradient(135deg,#f1c40f,#f39c12);
    --epic:linear-gradient(135deg,#8e44ad,#6c2eb9);
    --rare:linear-gradient(135deg,#3498db,#2980b9);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f6f8;
    font-family:'Outfit',sans-serif;
    color:#2c3e50;
    overflow-x:hidden;
}

/* =========================
   NAVBAR
========================= */

.vault-nav{
    background:white;
    border-bottom:2px solid #f1c40f;
    padding:16px 0;
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    text-decoration:none;
    font-family:'Cinzel',serif;
    font-size:1.8rem;
    font-weight:900;
    color:#3498db;
}

.nav-link-custom{
    margin-left:22px;
    text-decoration:none;
    color:#2c3e50;
    font-weight:700;
    transition:0.3s;
}

.nav-link-custom:hover{
    color:#f1c40f;
}

.nav-link-custom i{
    margin-right:6px;
}

/* =========================
   HERO
========================= */

.vault-hero{
    text-align:center;
    padding:50px 20px 30px;
}

.vault-hero h1{
    font-family:'Cinzel',serif;
    font-size:3rem;
    font-weight:900;
    color:#1b2f48;
}

.vault-hero p{
    margin-top:10px;
    color:#6d7b8b;
    font-size:1.05rem;
    font-style:italic;
}

/* =========================
   XP BOX
========================= */

.xp-vault-bar{
    background:white;
    max-width:750px;
    margin:auto;
    padding:26px;
    border-radius:24px;
    box-shadow:0 8px 28px rgba(0,0,0,0.06);
}

.xp-label{
    color:#3498db;
    font-weight:800;
    margin-bottom:10px;
    font-size:0.82rem;
}

.xp-track{
    height:16px;
    background:#e9eef5;
    border-radius:50px;
    overflow:hidden;
}

.xp-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#f1c40f,#f39c12);
    transition:1s;
}

/* =========================
   STATS
========================= */

.vault-stats{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
    margin:35px 0;
}

.stat-pill{
    background:white;
    width:120px;
    height:120px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.08);
    border-bottom:5px solid #3498db;
}

.stat-pill .num{
    font-size:1.7rem;
    font-weight:900;
    color:#3498db;
}

.stat-pill .lbl{
    font-size:0.72rem;
    text-transform:uppercase;
    color:#7b8b9a;
    margin-top:4px;
}

/* =========================
   FILTERS
========================= */

.filter-tabs{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:35px;
    flex-wrap:wrap;
}

.filter-btn{
    border:none;
    background:white;
    padding:12px 24px;
    border-radius:50px;
    border:2px solid #3498db;
    color:#3498db;
    font-weight:700;
    transition:0.3s;
    cursor:pointer;
}

.filter-btn.active,
.filter-btn:hover{
    background:#3498db;
    color:white;
}

/* =========================
   CARD GRID
========================= */

.cards-grid{
    max-width:1300px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:28px;
}

.card-wrapper{
    position:relative;
    height:370px;
    border-radius:22px;
    overflow:hidden;
    cursor:pointer;
    transition:0.35s;
    box-shadow:0 10px 30px rgba(0,0,0,0.18);
}

.card-wrapper:hover{
    transform:translateY(-10px) scale(1.02);
}

.card-img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.rarity-tag{
    position:absolute;
    top:14px;
    right:14px;
    padding:6px 14px;
    border-radius:50px;
    color:white;
    font-size:0.7rem;
    font-weight:800;
}

.flip-hint-badge{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.65);
    color:white;
    font-size:0.72rem;
    padding:6px 16px;
    border-radius:50px;
    backdrop-filter:blur(5px);
}

/* =========================
   LOCKED
========================= */

.card-locked img{
    filter:blur(3px) grayscale(1) brightness(0.55);
}

.lock-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    background:rgba(0,0,0,0.35);
}

.lock-overlay i{
    font-size:3rem;
    margin-bottom:12px;
}

.lock-overlay div{
    font-weight:800;
}

/* =====================================================
   PREMIUM MODAL
===================================================== */

.card-modal-overlay{
    position:fixed;
    inset:0;
    z-index:9999;

    display:none;
    justify-content:center;
    align-items:center;

    padding:30px;

    background:
    radial-gradient(circle at top left,#17345f 0%,#081120 40%,#02060d 100%);

    overflow:hidden;
}

.card-modal-overlay.active{
    display:flex;
}

.card-modal-overlay::before{
    content:'';
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    background:rgba(52,152,219,0.14);
    filter:blur(120px);
    top:-180px;
    left:-120px;
}

.stars{
    position:absolute;
    inset:0;
    opacity:0.08;
    background-image:
    radial-gradient(white 1px, transparent 1px);
    background-size:40px 40px;
    pointer-events:none;
}

/* CLOSE */

.modal-close-btn{
    position:absolute;
    top:24px;
    right:24px;
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:1.3rem;
    cursor:pointer;
    z-index:5;
    transition:0.3s;
}

.modal-close-btn:hover{
    background:rgba(255,255,255,0.2);
}

/* LAYOUT */

.modal-body{
    position:relative;
    width:100%;
    max-width:1250px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:70px;

    z-index:2;
}

/* CARD */

.modal-card-scene{
    perspective:1200px;
    width:min(400px,90vw);
    height:min(600px,82vh);
    flex-shrink:0;
}

.modal-card-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:0.8s;
}

.modal-card-inner.flipped{
    transform:rotateY(180deg);
}

.modal-card-face{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:26px;
    overflow:hidden;
    backface-visibility:hidden;

    border:1px solid rgba(241,196,15,0.35);

    box-shadow:
    0 0 0 1px rgba(255,255,255,0.05),
    0 0 45px rgba(241,196,15,0.18),
    0 25px 70px rgba(0,0,0,0.7);
}

.modal-card-face img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.modal-card-back-face{
    transform:rotateY(180deg);
}

.modal-hint{
    margin-top:18px;
    color:rgba(255,255,255,0.7);
    text-align:center;
    font-size:0.85rem;
}

.modal-hint i{
    color:#f1c40f;
}

/* INFO PANEL */

.modal-info{
    width:100%;
    max-width:520px;
    color:white;
}

.scientist-name{
    font-family:'Cinzel',serif;
    font-size:3rem;
    line-height:1.1;
    font-weight:900;
    color:#ffe082;
    margin-bottom:10px;
}

.scientist-title{
    font-size:1.1rem;
    color:rgba(255,255,255,0.7);
    margin-bottom:22px;
}

.rarity-pill{
    display:inline-block;
    padding:8px 18px;
    border-radius:50px;
    font-size:0.72rem;
    font-weight:800;
    color:white;
    margin-bottom:28px;
}

.section-label{
    color:#f1c40f;
    font-size:0.8rem;
    font-weight:800;
    margin-bottom:12px;
    letter-spacing:1px;
    text-transform:uppercase;
}

/* MINI INFO */

.info-mini-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:28px;
}

.mini-info-card{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    padding:16px;
    border-radius:16px;
    text-align:center;
    backdrop-filter:blur(10px);
}

.mini-label{
    font-size:0.65rem;
    color:#f1c40f;
    margin-bottom:6px;
    font-weight:800;
}

.mini-value{
    font-size:0.9rem;
    font-weight:700;
}

/* ACHIEVEMENTS */

.modal-info ul{
    padding-left:20px;
    margin-bottom:26px;
}

.modal-info ul li{
    margin-bottom:8px;
    line-height:1.5;
    color:rgba(255,255,255,0.88);
}

/* TIMELINE */

.timeline-box{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:28px;
}

.timeline-item{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    padding:14px;
    border-radius:14px;
    color:rgba(255,255,255,0.85);
    font-size:0.84rem;
    backdrop-filter:blur(8px);
}

/* FUN FACT */

.did-you-know{
    background:rgba(241,196,15,0.08);
    border-left:4px solid #f1c40f;
    padding:16px;
    border-radius:14px;
    line-height:1.7;
    margin-bottom:22px;
    color:#f5f5f5;
    font-size:0.85rem;
}

/* QUOTE */

.modal-quote{
    border-left:4px solid #3498db;
    padding-left:16px;
    color:rgba(255,255,255,0.75);
    font-style:italic;
    line-height:1.7;
}

/* MOBILE */

@media(max-width:900px){

    .modal-body{
        flex-direction:column;
        gap:35px;
        overflow-y:auto;
        max-height:90vh;
        padding-top:30px;
    }

    .scientist-name{
        font-size:2.3rem;
        text-align:center;
    }

    .scientist-title{
        text-align:center;
    }

    .modal-info{
        max-width:100%;
    }

}

@media(max-width:576px){

    .vault-hero h1{
        font-size:2.2rem;
    }

    .cards-grid{
        grid-template-columns:repeat(2,1fr);
        gap:14px;
    }

    .card-wrapper{
        height:290px;
    }

    .info-mini-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="vault-nav">
<div class="container d-flex justify-content-between align-items-center">

<a href="dashboard.html" class="brand">
SmartQuizzer ☀️
</a>

<div class="d-none d-md-flex">

<a href="dashboard.html" class="nav-link-custom">
<i class="fa-solid fa-house"></i>Home
</a>

<a href="#" class="nav-link-custom">
<i class="fa-solid fa-book-open"></i>Study Hub
</a>

<a href="#" class="nav-link-custom">
<i class="fa-solid fa-fire"></i>Mistakes
</a>

<a href="https://simrankaurrrrrr-smartquizzer-backend.hf.space/logout"
class="nav-link-custom text-danger">
<i class="fa-solid fa-power-off"></i>Logout
</a>

</div>
</div>
</nav>

<!-- HERO -->

<div class="vault-hero">
<h1>Scholar’s Vault</h1>
<p>Unlock legendary minds as you earn XP through quizzes!</p>
</div>

<!-- XP -->

<div class="xp-vault-bar mx-3 mx-md-auto">

<div class="xp-label">YOUR PROGRESS</div>

<div class="xp-track">
<div class="xp-fill" id="vault-xp-bar"></div>
</div>

<div class="d-flex justify-content-between mt-2 fw-bold">
<span id="vault-xp-text">0 XP</span>
<span id="vault-cards-text">0 / 10 Unlocked</span>
</div>

</div>

<!-- STATS -->

<div class="vault-stats">

<div class="stat-pill">
<div class="num" id="stat-unlocked">0</div>
<div class="lbl">Unlocked</div>
</div>

<div class="stat-pill">
<div class="num" id="stat-xp">0</div>
<div class="lbl">Your XP</div>
</div>

<div class="stat-pill">
<div class="num" id="stat-next">500</div>
<div class="lbl">Next Unlock</div>
</div>

</div>

<!-- FILTERS -->

<div class="filter-tabs">

<button class="filter-btn active"
onclick="filterCards('all',this)">
All
</button>

<button class="filter-btn"
onclick="filterCards('unlocked',this)">
Unlocked
</button>

<button class="filter-btn"
onclick="filterCards('locked',this)">
Locked
</button>

</div>

<!-- GRID -->

<div class="cards-grid" id="cards-grid"></div>

<!-- ======================================================
     PREMIUM MODAL
====================================================== -->

<div class="card-modal-overlay" id="cardModal">

<div class="stars"></div>

<button class="modal-close-btn" id="modalCloseBtn">
<i class="fa-solid fa-xmark"></i>
</button>

<div class="modal-body">

<div>

<div class="modal-card-scene" id="modalCardScene">

<div class="modal-card-inner" id="modalCardInner">

<div class="modal-card-face">
<img id="modalFrontImg" src="">
</div>

<div class="modal-card-face modal-card-back-face">
<img id="modalBackImg" src="">
</div>

</div>
</div>

<div class="modal-hint" id="modalHint">
<i class="fa-solid fa-rotate"></i>
Click card to flip
</div>

</div>

<!-- RIGHT INFO -->

<div class="modal-info">

<div class="scientist-name" id="modalName"></div>

<div class="scientist-title" id="modalTitle"></div>

<div class="rarity-pill" id="modalRarity"></div>

<!-- MINI INFO -->

<div class="info-mini-grid">

<div class="mini-info-card">
<div class="mini-label">FIELD</div>
<div class="mini-value" id="modalField"></div>
</div>

<div class="mini-info-card">
<div class="mini-label">COUNTRY</div>
<div class="mini-value" id="modalCountry"></div>
</div>

<div class="mini-info-card">
<div class="mini-label">BORN</div>
<div class="mini-value" id="modalBorn"></div>
</div>

</div>

<!-- ACHIEVEMENTS -->

<div class="section-label">
🏆 Achievements
</div>

<ul id="modalAchievements"></ul>

<!-- TIMELINE -->

<div class="section-label">
📜 Timeline
</div>

<div class="timeline-box" id="modalTimeline"></div>

<!-- DID YOU KNOW -->

<div class="did-you-know" id="modalFact"></div>

<!-- QUOTE -->

<div class="modal-quote" id="modalQuote"></div>

</div>

</div>
</div>

<script>

const BASE_IMG =
"https://raw.githubusercontent.com/Simrannnnnnnnnnnn/SmartQuizzer-Web/main/cards";

const ALL_CARDS = [

{
id:1,
name:"APJ Abdul Kalam",
title:"Missile Man of India",
rarity:"legendary",
xp_required:0,

field:"Aerospace Science",
country:"India",
born:"1931",

achievements:[
"Led IGMDP Program",
"11th President of India",
"Developed Agni Missile",
"Inspired millions of students",
"Known as People's President"
],

timeline:[
"1960 → Joined DRDO",
"1980 → Led SLV-III",
"1998 → Pokhran-II",
"2002 → Became President"
],

fact:"💡 Did you know? Kalam sold newspapers as a child before becoming one of India's greatest scientists.",

quote:"Dream big, dreams transform into action.",

front:`${BASE_IMG}/front_side/Apj_Abdul_kalam_Front.png`,
back:`${BASE_IMG}/back_side/APJ_Abdul_Kalam_Back.png`
},

{
id:2,
name:"Albert Einstein",
title:"Father of Modern Physics",
rarity:"legendary",
xp_required:500,

field:"Physics",
country:"Germany",
born:"1879",

achievements:[
"Developed Theory of Relativity",
"Created E = mc²",
"Nobel Prize Winner",
"Changed modern science forever"
],

timeline:[
"1905 → Annus Mirabilis Papers",
"1915 → General Relativity",
"1921 → Nobel Prize",
"1933 → Moved to USA"
],

fact:"💡 Einstein did not speak fluently until around age 9.",

quote:"Imagination is more important than knowledge.",

front:`${BASE_IMG}/front_side/Albert_einstein_front.png`,
back:`${BASE_IMG}/back_side/albert_einstein_back.png`
},

{
id:3,
name:"Marie Curie",
title:"Radioactivity Pioneer",
rarity:"legendary",
xp_required:1500,

field:"Chemistry",
country:"Poland",
born:"1867",

achievements:[
"Discovered Radium",
"First woman Nobel winner",
"Won 2 Nobel Prizes",
"Advanced cancer treatment"
],

timeline:[
"1898 → Discovered Radium",
"1903 → Nobel Prize Physics",
"1911 → Nobel Prize Chemistry",
"1914 → Mobile X-Ray Units"
],

fact:"💡 Marie Curie carried radioactive samples in her pockets without knowing the dangers.",

quote:"Nothing in life is to be feared, only understood.",

front:`${BASE_IMG}/front_side/Marie_curie_front.png`,
back:`${BASE_IMG}/back_side/Marie_Curie_back.png`
}

];

let userXP = 40;
let activeFilter = 'all';

/* =========================
   RENDER
========================= */

function renderAll(){

const unlocked =
ALL_CARDS.filter(c => userXP >= c.xp_required).length;

document.getElementById('stat-unlocked').textContent = unlocked;
document.getElementById('stat-xp').textContent = userXP;

document.getElementById('vault-xp-text').textContent =
`${userXP} XP`;

document.getElementById('vault-cards-text').textContent =
`${unlocked} / ${ALL_CARDS.length} Unlocked`;

const nextCard =
ALL_CARDS.find(c => userXP < c.xp_required);

document.getElementById('stat-next').textContent =
nextCard ? nextCard.xp_required - userXP : "DONE";

const percent = Math.min((userXP / 5000) * 100,100);

document.getElementById('vault-xp-bar').style.width =
percent + "%";

renderCards();
}

/* =========================
   CARDS
========================= */

function renderCards(){

const grid = document.getElementById('cards-grid');

grid.innerHTML = '';

ALL_CARDS
.filter(card => {

if(activeFilter === 'unlocked')
return userXP >= card.xp_required;

if(activeFilter === 'locked')
return userXP < card.xp_required;

return true;

})
.forEach(card => {

const isUnlocked = userXP >= card.xp_required;

const wrapper = document.createElement('div');

wrapper.className =
`card-wrapper ${isUnlocked ? '' : 'card-locked'}`;

wrapper.innerHTML = `

<img class="card-img" src="${card.front}">

<div class="rarity-tag"
style="background:var(--${card.rarity})">
${card.rarity.toUpperCase()}
</div>

${isUnlocked
?
`<div class="flip-hint-badge">
<i class="fa-solid fa-rotate"></i>
Tap to Explore
</div>`

:

`<div class="lock-overlay">
<i class="fa-solid fa-lock"></i>
<div>${card.xp_required - userXP} XP Needed</div>
</div>`

}

`;

if(isUnlocked){
wrapper.addEventListener('click',() => openModal(card));
}

grid.appendChild(wrapper);

});

}

/* =========================
   MODAL
========================= */

const modal = document.getElementById('cardModal');
const cardInner = document.getElementById('modalCardInner');

function openModal(card){

document.getElementById('modalFrontImg').src = card.front;
document.getElementById('modalBackImg').src = card.back;

document.getElementById('modalName').textContent = card.name;
document.getElementById('modalTitle').textContent = card.title;

const rarity = document.getElementById('modalRarity');

rarity.textContent = card.rarity.toUpperCase();
rarity.style.background = `var(--${card.rarity})`;

document.getElementById('modalField').textContent = card.field;
document.getElementById('modalCountry').textContent = card.country;
document.getElementById('modalBorn').textContent = card.born;

document.getElementById('modalAchievements').innerHTML =
card.achievements.map(a => `<li>${a}</li>`).join('');

document.getElementById('modalTimeline').innerHTML =
card.timeline.map(t =>
`<div class="timeline-item">${t}</div>`
).join('');

document.getElementById('modalFact').textContent =
card.fact;

document.getElementById('modalQuote').textContent =
`"${card.quote}"`;

cardInner.classList.remove('flipped');

modal.classList.add('active');

document.body.style.overflow = 'hidden';

}

function closeModal(){

modal.classList.remove('active');

document.body.style.overflow = '';

}

/* FLIP */

document.getElementById('modalCardScene')
.addEventListener('click', () => {

cardInner.classList.toggle('flipped');

});

/* CLOSE */

document.getElementById('modalCloseBtn')
.addEventListener('click', closeModal);

modal.addEventListener('click', e => {
if(e.target === modal){
closeModal();
}
});

/* FILTER */

function filterCards(type,btn){

activeFilter = type;

document.querySelectorAll('.filter-btn')
.forEach(b => b.classList.remove('active'));

btn.classList.add('active');

renderCards();

}

renderAll();

</script>

</body>
</html>
