<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Vault | SmartQuizzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #FFD700;
            --gold-dark: #b8860b;
            --navy: #0a0e1a;
            --navy-card: #0d1528;
            --legendary: linear-gradient(135deg, #FFD700, #FF6B00, #FFD700);
            --epic: linear-gradient(135deg, #9B59B6, #6C3483, #9B59B6);
            --rare: linear-gradient(135deg, #3498DB, #1A5276, #3498DB);
            --common: linear-gradient(135deg, #7F8C8D, #2C3E50, #7F8C8D);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--navy);
            font-family: 'Crimson Text', serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Stars background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, rgba(255,215,0,0.4) 0%, transparent 100%),
                radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
                radial-gradient(1px 1px at 50% 60%, rgba(255,215,0,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.2) 0%, transparent 100%),
                radial-gradient(1px 1px at 90% 70%, rgba(255,215,0,0.3) 0%, transparent 100%),
                radial-gradient(2px 2px at 35% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
                radial-gradient(2px 2px at 65% 85%, rgba(255,215,0,0.3) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* NAV */
        .vault-nav {
            background: rgba(10,14,26,0.95);
            border-bottom: 2px solid var(--gold-dark);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .vault-nav .brand {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold);
            text-decoration: none;
            font-weight: 900;
        }
        .nav-link-custom {
            color: #ccc !important;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            margin: 0 10px;
            text-decoration: none;
            transition: 0.3s;
        }
        .nav-link-custom:hover { color: var(--gold) !important; }
        .nav-link-custom i { color: var(--gold); margin-right: 5px; }

        /* HERO SECTION */
        .vault-hero {
            text-align: center;
            padding: 50px 20px 30px;
            position: relative;
            z-index: 1;
        }
        .vault-hero h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: none;
        }
        .vault-hero p {
            color: #aaa;
            font-size: 1.1rem;
            font-style: italic;
        }

        /* XP PROGRESS BAR */
        .xp-vault-bar {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 20px;
            padding: 16px 24px;
            margin: 0 auto 40px;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }
        .xp-vault-bar .xp-label {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            color: var(--gold);
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .xp-track {
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            height: 12px;
            overflow: hidden;
        }
        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FFA500);
            border-radius: 50px;
            transition: width 1.5s ease;
            box-shadow: 0 0 10px rgba(255,215,0,0.5);
        }
        .xp-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #888;
        }

        /* FILTER TABS */
        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }
        .filter-btn {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,215,0,0.3);
            background: transparent;
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.05em;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        /* CARDS GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
            padding: 0 20px 60px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* CARD WRAPPER */
        .card-wrapper {
            perspective: 1000px;
            height: 340px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-wrapper:hover .card-inner,
        .card-wrapper.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            overflow: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* LOCKED CARD */
        .card-locked .card-front {
            filter: brightness(0.3) grayscale(1);
        }
        .card-locked .lock-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 16px;
        }
        .card-locked .lock-overlay i {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 8px;
            opacity: 0.8;
        }
        .card-locked .lock-overlay span {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: var(--gold);
            text-align: center;
            opacity: 0.8;
            letter-spacing: 0.05em;
        }

        /* FRONT IMAGE */
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* RARITY BORDER */
        .rarity-legendary { box-shadow: 0 0 20px rgba(255,215,0,0.6), 0 0 40px rgba(255,100,0,0.3), inset 0 0 0 2px #FFD700; }
        .rarity-epic      { box-shadow: 0 0 20px rgba(155,89,182,0.6), 0 0 40px rgba(108,52,131,0.3), inset 0 0 0 2px #9B59B6; }
        .rarity-rare      { box-shadow: 0 0 20px rgba(52,152,219,0.6), 0 0 40px rgba(26,82,118,0.3), inset 0 0 0 2px #3498DB; }
        .rarity-common    { box-shadow: 0 0 10px rgba(127,140,141,0.4), inset 0 0 0 2px #7F8C8D; }

        /* RARITY BADGE on front */
        .rarity-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 50px;
            font-weight: 700;
            letter-spacing: 0.05em;
            z-index: 5;
        }
        .tag-legendary { background: linear-gradient(135deg, #FFD700, #FF6B00); color: #000; }
        .tag-epic      { background: linear-gradient(135deg, #9B59B6, #6C3483); color: #fff; }
        .tag-rare      { background: linear-gradient(135deg, #3498DB, #1A5276); color: #fff; }
        .tag-common    { background: linear-gradient(135deg, #7F8C8D, #2C3E50); color: #fff; }

        /* CARD BACK DESIGN */
        .card-back-content {
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #0d1528 0%, #0a1020 60%, #0d1a35 100%);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .back-title {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            font-weight: 900;
            color: var(--gold);
            text-align: center;
            border-bottom: 1px solid rgba(255,215,0,0.3);
            padding-bottom: 8px;
            margin-bottom: 8px;
            letter-spacing: 0.05em;
            line-height: 1.3;
        }

        .back-nickname {
            background: rgba(255,215,0,0.08);
            border-left: 3px solid var(--gold);
            padding: 5px 8px;
            margin-bottom: 8px;
            border-radius: 0 6px 6px 0;
        }
        .back-nickname .nic-label {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            color: var(--gold);
            letter-spacing: 0.08em;
        }
        .back-nickname .nic-value {
            font-size: 0.75rem;
            color: #fff;
            font-style: italic;
            line-height: 1.3;
        }

        .back-achievements {
            flex: 1;
            overflow: hidden;
        }
        .back-achievements .ach-label {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            color: var(--gold);
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }
        .back-achievements ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .back-achievements ul li {
            font-size: 0.68rem;
            color: #ccc;
            padding: 2px 0;
            padding-left: 12px;
            position: relative;
            line-height: 1.3;
        }
        .back-achievements ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--gold);
            font-size: 0.6rem;
        }

        .back-quote {
            margin-top: 6px;
            padding: 5px 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            font-size: 0.62rem;
            font-style: italic;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
            border-top: 1px solid rgba(255,215,0,0.15);
        }

        .back-rarity {
            text-align: center;
            margin-top: 5px;
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            color: var(--gold);
            letter-spacing: 0.1em;
        }

        /* SHIMMER on hover */
        .card-wrapper:not(.card-locked):hover .card-front::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.08) 50%, transparent 60%);
            animation: shimmer 0.6s ease;
            pointer-events: none;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* UNLOCK ANIMATION */
        @keyframes unlockPop {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .card-wrapper.just-unlocked {
            animation: unlockPop 0.6s ease forwards;
        }

        /* STATS ROW */
        .vault-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }
        .stat-pill {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 50px;
            padding: 8px 20px;
            text-align: center;
        }
        .stat-pill .num {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
        }
        .stat-pill .lbl {
            font-size: 0.75rem;
            color: #888;
        }

        /* SECTION LABEL */
        .section-label {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            color: var(--gold-dark);
            letter-spacing: 0.15em;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }
        .section-label::before, .section-label::after {
            content: '——————';
            opacity: 0.3;
            margin: 0 10px;
        }

        /* MOBILE */
        @media (max-width: 576px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 12px 40px; }
            .card-wrapper { height: 280px; }
        }
    </style>
</head>

<!-- CARDS GRID -->
<div class="cards-grid" id="cards-grid"></div>

    {
        id: 10,
        name: "Tim Berners-Lee",
        title: "Inventor of the World Wide Web",
        field: "Computer Science",
        rarity: "legendary",
        xp_required: 4500,
        front: `${BASE_IMG}/front_side/TIM_Berners_lee_front.png`,
        back: `${BASE_IMG}/back_side/Tim_Berners_Lee_Back.png`,
        nickname: ["Inventor of the World Wide Web", "The Man Who Connected the World"],
        achievements: [
            "Invented World Wide Web in 1989 at CERN",
            "Created HTTP protocol & HTML language",
            "Built world's first web browser & web server",
            "Gave WWW to entire world for FREE — no patent!",
            "Changed how 5+ billion people communicate daily"
        ],
        quote: "The Web is more a social creation than a technical one."
    }
];

const rarityStars = { legendary: "★★★★★", epic: "★★★★", rare: "★★★", common: "★★" };

let userXP = 0;
let activeFilter = 'all';

async function loadUserXP() {
    try {
        const res = await fetch(`${BACKEND_URL}/api/dashboard_stats`, { credentials: 'include' });
        const data = await res.json();
        if (data.success) {
            userXP = data.total_xp || 0;
        }
    } catch(e) {
        console.error('XP load failed:', e);
    }
    renderAll();
}

function renderAll() {
    updateStats();
    renderCards();
}

function updateStats() {
    const unlocked = ALL_CARDS.filter(c => userXP >= c.xp_required).length;
    const legendary = ALL_CARDS.filter(c => userXP >= c.xp_required && c.rarity === 'legendary').length;

    // Next card
    const nextCard = ALL_CARDS.find(c => userXP < c.xp_required);
    const nextXP = nextCard ? nextCard.xp_required - userXP : 0;

    document.getElementById('stat-unlocked').textContent = unlocked;
    document.getElementById('stat-legendary').textContent = legendary;
    document.getElementById('stat-xp').textContent = userXP;
    document.getElementById('stat-next').textContent = nextXP > 0 ? nextXP : '✓ All!';

    document.getElementById('vault-xp-text').textContent = `${userXP} XP`;
    document.getElementById('vault-cards-text').textContent = `${unlocked} / ${ALL_CARDS.length} Cards Unlocked`;

    const maxXP = ALL_CARDS[ALL_CARDS.length - 1].xp_required + 500;
    const pct = Math.min((userXP / maxXP) * 100, 100);
    setTimeout(() => {
        document.getElementById('vault-xp-bar').style.width = pct + '%';
    }, 300);
}

function renderCards() {
    const grid = document.getElementById('cards-grid');
    grid.innerHTML = '';

    const filtered = ALL_CARDS.filter(c => {
        const isUnlocked = userXP >= c.xp_required;
        if (activeFilter === 'unlocked') return isUnlocked;
        if (activeFilter === 'locked') return !isUnlocked;
        if (activeFilter === 'legendary') return c.rarity === 'legendary';
        if (activeFilter === 'epic') return c.rarity === 'epic';
        return true;
    });

    filtered.forEach(card => {
        const isUnlocked = userXP >= card.xp_required;
        const wrapper = document.createElement('div');
        wrapper.className = `card-wrapper${isUnlocked ? '' : ' card-locked'}`;
        wrapper.dataset.rarity = card.rarity;

        if (isUnlocked) {
            wrapper.addEventListener('click', () => wrapper.classList.toggle('flipped'));
        }

        const xpNeeded = card.xp_required - userXP;

        wrapper.innerHTML = `
            <div class="card-inner">
                <!-- FRONT -->
                <div class="card-front rarity-${card.rarity}">
                    <img src="${card.front}" alt="${card.name}" loading="lazy" onerror="this.style.background='#0d1528';this.alt='${card.name}'">
                    <span class="rarity-tag tag-${card.rarity}">${card.rarity.toUpperCase()}</span>
                    ${!isUnlocked ? `
                    <div class="lock-overlay">
                        <i class="fa-solid fa-lock"></i>
                        <span>LOCKED<br>${xpNeeded} XP needed</span>
                    </div>` : ''}
                </div>
                <!-- BACK -->
                <div class="card-back rarity-${card.rarity}">
                    <div class="card-back-content">
                        <div class="back-title">${card.name.toUpperCase()}<br>${card.title}</div>
                        <div class="back-nickname">
                            <div class="nic-label">⚡ KNOWN AS</div>
                            <div class="nic-value">${card.nickname[0]}</div>
                        </div>
                        <div class="back-achievements">
                            <div class="ach-label">🏆 ACHIEVEMENTS</div>
                            <ul>
                                ${card.achievements.map(a => `<li>${a}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="back-quote">"${card.quote}"</div>
                        <div class="back-rarity">${rarityStars[card.rarity]} ${card.rarity.toUpperCase()}</div>
                    </div>
                </div>
            </div>
        `;
        grid.appendChild(wrapper);
    });

    if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#666; font-family:'Cinzel',serif; padding:60px 0;">No cards match this filter.</div>`;
    }
}

function filterCards(type, btn) {
    activeFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
}

loadUserXP();
</script>

</body>
</html>
