<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Scholar's Vault | SmartQuizzer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --primary-blue:#3498db;
    --dark-blue:#2c3e50;
    --sunny-yellow:#f1c40f;
    --soft-bg:#f4f9ff;

    --legendary:linear-gradient(135deg,#f1c40f,#f39c12);
    --epic:linear-gradient(135deg,#9b59b6,#8e44ad);
    --rare:linear-gradient(135deg,#3498db,#2980b9);
    --common:linear-gradient(135deg,#95a5a6,#7f8c8d);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top,#ffffff,#eef6ff);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    color:var(--dark-blue);
    overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.vault-nav{
    background:white;
    border-bottom:3px solid var(--sunny-yellow);
    padding:14px 0;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}

.brand{
    text-decoration:none;
    font-family:'Cinzel',serif;
    font-weight:900;
    font-size:1.7rem;
    color:var(--primary-blue);
}

.nav-link-custom{
    margin-left:22px;
    text-decoration:none;
    color:var(--dark-blue);
    font-weight:600;
    transition:0.3s;
}

.nav-link-custom:hover{
    color:var(--primary-blue);
}

.nav-link-custom i{
    margin-right:6px;
    color:var(--sunny-yellow);
}

/* ================= HERO ================= */

.vault-hero{
    text-align:center;
    padding:50px 20px 25px;
}

.vault-hero h1{
    font-family:'Cinzel',serif;
    font-size:3rem;
    font-weight:900;
    color:var(--dark-blue);
}

.vault-hero p{
    color:#607080;
    margin-top:10px;
    font-style:italic;
    font-size:1rem;
}

/* ================= XP ================= */

.xp-vault-bar{
    background:white;
    max-width:760px;
    margin:auto;
    padding:24px;
    border-radius:22px;
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
}

.xp-label{
    font-size:0.8rem;
    font-weight:700;
    color:var(--primary-blue);
    margin-bottom:10px;
}

.xp-track{
    height:16px;
    border-radius:50px;
    overflow:hidden;
    background:#e8edf3;
}

.xp-fill{
    height:100%;
    width:0%;
    background:var(--legendary);
    transition:width 1s ease;
}

/* ================= STATS ================= */

.vault-stats{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin:35px 0;
}

.stat-pill{
    background:white;
    padding:14px 26px;
    border-radius:50px;
    box-shadow:0 5px 14px rgba(0,0,0,0.08);
    border-bottom:4px solid var(--primary-blue);
    text-align:center;
}

.stat-pill .num{
    font-size:1.25rem;
    font-weight:800;
    color:var(--primary-blue);
}

.stat-pill .lbl{
    font-size:0.75rem;
    color:#7d8b99;
    text-transform:uppercase;
}

/* ================= FILTER ================= */

.filter-tabs{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:35px;
}

.filter-btn{
    border:none;
    padding:11px 22px;
    border-radius:50px;
    background:white;
    color:var(--primary-blue);
    border:2px solid var(--primary-blue);
    font-weight:700;
    transition:0.3s;
    cursor:pointer;
}

.filter-btn:hover,
.filter-btn.active{
    background:var(--primary-blue);
    color:white;
}

/* ================= GRID ================= */

.cards-grid{
    max-width:1450px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
    gap:30px;
}

/* ================= CARD ================= */

.card-wrapper{
    height:430px;
    border-radius:24px;
    overflow:hidden;
    position:relative;
    box-shadow:0 14px 32px rgba(0,0,0,0.14);
    transition:0.35s;
    background:white;
}

.card-wrapper.unlocked{
    cursor:pointer;
}

.card-wrapper.unlocked:hover{
    transform:
    translateY(-10px)
    scale(1.02);

    box-shadow:
    0 24px 40px rgba(52,152,219,0.25);
}

.card-wrapper img.card-img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* holographic overlay */

.card-wrapper.unlocked::before{
    content:'';
    position:absolute;
    inset:0;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.18),
    transparent 25%,
    rgba(52,152,219,0.10),
    transparent 70%,
    rgba(241,196,15,0.15)
    );

    pointer-events:none;
}

/* ================= TAG ================= */

.rarity-tag{
    position:absolute;
    top:14px;
    right:14px;
    padding:6px 14px;
    border-radius:50px;
    color:white;
    font-size:0.68rem;
    font-weight:800;
    box-shadow:0 5px 16px rgba(0,0,0,0.2);
}

/* ================= HINT ================= */

.flip-hint-badge{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,0.55);
    color:white;
    font-size:0.72rem;
    font-weight:600;
    padding:7px 16px;
    border-radius:50px;
    white-space:nowrap;
    backdrop-filter:blur(4px);
}

/* ================= LOCKED ================= */

.card-wrapper.card-locked img.card-img{
    filter:
    blur(2px)
    grayscale(0.8)
    brightness(0.6);
}

.lock-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:rgba(20,20,20,0.4);
    backdrop-filter:blur(3px);

    color:white;
    text-align:center;
}

.lock-overlay i{
    font-size:3.5rem;
    margin-bottom:14px;
}

.lock-overlay div{
    font-weight:800;
    font-size:1rem;
}

/* ======================================================
   MODAL SHOWCASE
====================================================== */

.card-modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;

    background:
    radial-gradient(circle at top,
    rgba(52,152,219,0.18),
    transparent 30%),

    radial-gradient(circle at bottom right,
    rgba(241,196,15,0.15),
    transparent 35%),

    rgba(5,8,20,0.95);

    backdrop-filter:blur(14px);
    justify-content:center;
    align-items:center;
    padding:25px;

    animation:fadeInModal 0.35s ease;
}

.card-modal-overlay.active{
    display:flex;
}

@keyframes fadeInModal{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes fadeOutModal{
    from{
        opacity:1;
    }
    to{
        opacity:0;
    }
}

/* ================= CLOSE ================= */

.modal-close-btn{
    position:absolute;
    top:24px;
    right:26px;

    background:rgba(255,255,255,0.1);
    border:none;
    color:white;

    font-size:1.4rem;

    width:46px;
    height:46px;

    border-radius:50%;
    cursor:pointer;
    transition:0.3s;

    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-close-btn:hover{
    background:rgba(255,255,255,0.22);
}

/* ================= MODAL BODY ================= */

.modal-body{
    display:flex;
    align-items:center;
    gap:55px;

    position:relative;

    max-width:1300px;
    width:100%;
}

/* ================= CARD SCENE ================= */

.modal-card-scene{
    perspective:2000px;

    width:min(500px,90vw);
    height:min(740px,85vh);

    cursor:pointer;
    flex-shrink:0;

    transition:transform 0.25s ease;

    animation:cardFloatUp 0.55s cubic-bezier(0.22,1,0.36,1);
}

@keyframes cardFloatUp{
    from{
        transform:
        translateY(80px)
        scale(0.72);

        opacity:0;
    }

    to{
        transform:
        translateY(0)
        scale(1);

        opacity:1;
    }
}

/* ================= INNER ================= */

.modal-card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);
}

.modal-card-inner.flipped{
    transform:rotateY(180deg);
}

/* ================= CARD FACE ================= */

.modal-card-face{
    position:absolute;
    width:100%;
    height:100%;

    border-radius:28px;
    overflow:hidden;

    backface-visibility:hidden;

    box-shadow:
    0 0 0 2px rgba(255,255,255,0.08),
    0 25px 70px rgba(0,0,0,0.7),
    0 0 60px rgba(52,152,219,0.2);
}

.modal-card-face img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* holographic glow */

.modal-card-face::before{
    content:'';
    position:absolute;
    inset:0;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.18),
    transparent 30%,
    rgba(52,152,219,0.12),
    transparent 70%,
    rgba(241,196,15,0.18)
    );

    mix-blend-mode:screen;
    pointer-events:none;
}

.modal-card-face::after{
    content:'';
    position:absolute;
    inset:-2px;

    border-radius:28px;

    background:
    linear-gradient(
    135deg,
    rgba(52,152,219,0.55),
    rgba(241,196,15,0.35),
    rgba(155,89,182,0.45)
    );

    z-index:-1;
    filter:blur(24px);
    opacity:0.7;
}

.modal-card-back-face{
    transform:rotateY(180deg);
}

/* ================= HINT ================= */

.modal-hint{
    color:rgba(255,255,255,0.65);
    font-size:0.85rem;
    text-align:center;
    margin-top:18px;
    letter-spacing:0.04em;
}

.modal-hint i{
    margin-right:5px;
    color:var(--sunny-yellow);
}

/* ================= INFO ================= */

.modal-info{
    color:white;

    max-width:450px;
    width:100%;

    padding:20px 0;
}

.modal-info .scientist-name{
    font-family:'Cinzel',serif;
    font-size:2.5rem;
    font-weight:900;
    line-height:1.1;

    background:
    linear-gradient(135deg,#ffffff,#f1c40f);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.modal-info .scientist-title{
    color:rgba(255,255,255,0.72);
    font-size:1rem;
    margin-top:8px;
    margin-bottom:22px;
}

.modal-info .rarity-pill{
    display:inline-block;
    padding:6px 16px;
    border-radius:50px;
    font-size:0.74rem;
    font-weight:800;
    color:white;
    margin-bottom:24px;
}

.modal-info .section-label{
    color:var(--sunny-yellow);
    font-size:0.78rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:10px;
}

.modal-info ul{
    padding-left:20px;
    font-size:0.95rem;
    color:rgba(255,255,255,0.88);
    margin-bottom:24px;
}

.modal-info ul li{
    margin-bottom:8px;
}

.modal-info .modal-quote{
    font-style:italic;
    font-size:0.92rem;
    color:rgba(255,255,255,0.72);
    border-left:3px solid var(--primary-blue);
    padding-left:14px;
    line-height:1.7;
}

/* ================= MOBILE ================= */

@media(max-width:950px){

    .modal-body{
        flex-direction:column;
        overflow-y:auto;
        max-height:92vh;
        gap:25px;
    }

    .modal-info{
        text-align:center;
    }

    .modal-info ul{
        text-align:left;
    }

    .modal-info .modal-quote{
        text-align:left;
    }
}

@media(max-width:576px){

    .cards-grid{
        grid-template-columns:repeat(2,1fr);
        gap:16px;
    }

    .card-wrapper{
        height:280px;
    }

    .vault-hero h1{
        font-size:2.1rem;
    }

    .modal-card-scene{
        width:92vw;
        height:72vh;
    }

    .modal-info .scientist-name{
        font-size:2rem;
    }
}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="vault-nav">

<div class="container d-flex justify-content-between align-items-center">

<a href="dashboard.html" class="brand">
SmartQuizzer ☀️
</a>

<div class="d-none d-md-flex">

<a href="dashboard.html" class="nav-link-custom">
<i class="fa-solid fa-house"></i>Home
</a>

<a href="https://simrankaurrrrrr-smartquizzer-backend.hf.space/logout"
class="nav-link-custom text-danger">
<i class="fa-solid fa-power-off"></i>Logout
</a>

</div>
</div>
</nav>

<!-- ================= HERO ================= -->

<div class="vault-hero">
<h1>Scholar's Vault</h1>
<p>Unlock legendary minds as you earn XP through quizzes!</p>
</div>

<!-- ================= XP ================= -->

<div class="xp-vault-bar mx-3 mx-md-auto">

<div class="xp-label">YOUR PROGRESS</div>

<div class="xp-track">
<div class="xp-fill" id="vault-xp-bar"></div>
</div>

style="font-size:0.82rem;font-weight:600;">

</div>

<div class="lbl">Your XP</div>
</div>

<div class="stat-pill">
<div class="num" id="stat-next">500</div>
<div class="lbl">Next Unlock</div>
</div>

</div>

<!-- ================= FILTER ================= -->

<div class="filter-tabs">

<button class="filter-btn active"
onclick="filterCards('all',this)">
All
</button>

<button class="filter-btn"
onclick="filterCards('unlocked',this)">
Unlocked
</button>

<button class="filter-btn"
onclick="filterCards('locked',this)">
Locked
</button>

</div>

<!-- ================= GRID ================= -->

<div class="cards-grid" id="cards-grid"></div>

<!-- ===================================================
     MODAL
=================================================== -->

<div class="card-modal-overlay" id="cardModal">

<button class="modal-close-btn" id="modalCloseBtn">
<i class="fa-solid fa-xmark"></i>
</button>

<div class="modal-body">

<!-- CARD -->

<div>

<div class="modal-card-scene" id="modalCardScene">

<div class="modal-card-inner" id="modalCardInner">

<div class="modal-card-face">
<img id="modalFrontImg" src="">
</div>

<div class="modal-card-face modal-card-back-face">
<img id="modalBackImg" src="">
</div>

</div>
</div>

<div class="modal-hint" id="modalHint">
<i class="fa-solid fa-rotate"></i>
Flip to see more about this card
</div>

</div>

<!-- INFO -->

<div class="modal-info">

<div class="scientist-name" id="modalName"></div>

<div class="scientist-title" id="modalTitle"></div>

<div class="rarity-pill" id="modalRarity"></div>

<div class="section-label">🏆 Achievements</div>

<ul id="modalAchievements"></ul>

<div class="section-label">📘 Details</div>

<ul id="modalDetails"></ul>

<div class="modal-quote" id="modalQuote"></div>

</div>

</div>
</div>

<script>

const BACKEND_URL =
"https://simrankaurrrrrr-smartquizzer-backend.hf.space";

const BASE_IMG =
"https://raw.githubusercontent.com/Simrannnnnnnnnnnn/SmartQuizzer-Web/main/cards";

/* ==================================================
   CARDS
================================================== */

const ALL_CARDS = [

{
id:1,
name:"APJ Abdul Kalam",
title:"Missile Man of India",
rarity:"legendary",
xp_required:0,

field:"Aerospace Science",
born:"1931",
country:"India",
known_for:"Agni & Prithvi Missiles",
fun_fact:"He sold newspapers as a child.",

achievements:[
"Led IGMDP Program",
"11th President of India",
"Developed Agni Missile",
"Inspired Millions of Students",
"Known as People's President"
],

quote:"Dream big, dreams transform into action.",

front:`${BASE_IMG}/front_side/Apj_Abdul_kalam_Front.png`,
back:`${BASE_IMG}/back_side/APJ_Abdul_Kalam_Back.png`
},

{
id:2,
name:"Albert Einstein",
title:"Modern Physics Father",
rarity:"legendary",
xp_required:1500,

field:"Physics",
born:"1879",
country:"Germany",
known_for:"Theory of Relativity",
fun_fact:"Einstein’s brain was preserved for research.",

achievements:[
"E=mc² Theory",
"Photoelectric Effect",
"Theory of Relativity",
"Nobel Prize Winner",
"Changed Modern Physics Forever"
],

quote:"Imagination is everything.",

front:`${BASE_IMG}/front_side/Albert_einstein_front.png`,
back:`${BASE_IMG}/back_side/albert_einstein_back.png`
},

{
id:3,
name:"Marie Curie",
title:"Radioactivity Pioneer",
rarity:"legendary",
xp_required:2000,

field:"Chemistry & Physics",
born:"1867",
country:"Poland",
known_for:"Radioactivity Research",
fun_fact:"First woman to win a Nobel Prize.",

achievements:[
"Discovered Radium",
"Two Nobel Prizes",
"Mobile X-rays",
"Advanced Cancer Treatment",
"First Female Professor at Sorbonne"
],

quote:"Understand, don't fear.",

front:`${BASE_IMG}/front_side/Marie_curie_front.png`,
back:`${BASE_IMG}/back_side/Marie_Curie_back.png`
}

];

/* ==================================================
   GLOBALS
================================================== */

let userXP = 0;
let activeFilter = 'all';

/* ==================================================
   LOAD XP
================================================== */

async function loadUserXP(){

    try{

        const res = await fetch(
        `${BACKEND_URL}/api/dashboard_stats`,
        { credentials:'include' }
        );

        const data = await res.json();

        if(data.success){
            userXP = data.total_xp || 0;
            renderAll();
        }

    }catch(err){

        console.log("XP load failed");
        renderAll();
    }
}

/* ==================================================
   RENDER
================================================== */

function renderAll(){

    const unlocked =
    ALL_CARDS.filter(c =>
    userXP >= c.xp_required).length;

    document.getElementById('stat-unlocked').textContent = unlocked;

    document.getElementById('stat-xp').textContent = userXP;

    document.getElementById('vault-xp-text').textContent =
    `${userXP} XP`;

    document.getElementById('vault-cards-text').textContent =
    `${unlocked} / ${ALL_CARDS.length} Unlocked`;

    const nextCard =
    ALL_CARDS.find(c => userXP < c.xp_required);

    document.getElementById('stat-next').textContent =
    nextCard
    ? `${nextCard.xp_required - userXP}`
    : "DONE";

    const percent =
    Math.min((userXP / 5000) * 100,100);

    document.getElementById('vault-xp-bar').style.width =
    percent + "%";

    renderCards();
}

/* ==================================================
   RENDER CARDS
================================================== */

function renderCards(){

    const grid =
    document.getElementById('cards-grid');

    grid.innerHTML = '';

    ALL_CARDS

    .filter(card => {

        if(activeFilter === 'unlocked')
        return userXP >= card.xp_required;

        if(activeFilter === 'locked')
        return userXP < card.xp_required;

        return true;
    })

    .forEach(card => {

        const isUnlocked =
        userXP >= card.xp_required;

        const wrapper =
        document.createElement('div');

        wrapper.className =
        `card-wrapper ${isUnlocked ? 'unlocked' : 'card-locked'}`;

        wrapper.innerHTML = `

        <img class="card-img"
        src="${card.front}">

        <div class="rarity-tag"
        style="background:var(--${card.rarity})">

        ${card.rarity.toUpperCase()}
        </div>

        ${
        isUnlocked

        ?

        `<div class="flip-hint-badge">
        <i class="fa-solid fa-rotate"></i>
        Tap to Explore
        </div>`

        :

        `<div class="lock-overlay">

        <i class="fa-solid fa-lock"></i>

        <div>
        ${card.xp_required - userXP}
        XP NEEDED
        </div>

        </div>`
        }
        `;

        if(isUnlocked){

            wrapper.addEventListener(
            'click',
            () => openModal(card)
            );
        }

        grid.appendChild(wrapper);
    });
}

/* ==================================================
   MODAL
================================================== */

const modal =
document.getElementById('cardModal');

const cardInner =
document.getElementById('modalCardInner');

const modalHint =
document.getElementById('modalHint');

/* OPEN */

function openModal(card){

    document.getElementById('modalFrontImg').src =
    card.front;

    document.getElementById('modalBackImg').src =
    card.back;

    document.getElementById('modalName').textContent =
    card.name;

    document.getElementById('modalTitle').textContent =
    card.title;

    const rarityPill =
    document.getElementById('modalRarity');

    rarityPill.textContent =
    card.rarity.toUpperCase();

    rarityPill.style.background =
    `var(--${card.rarity})`;

    document.getElementById('modalAchievements').innerHTML =
    card.achievements.map(a =>
    `<li>${a}</li>`).join('');

    document.getElementById('modalDetails').innerHTML =

    `
    <li><strong>Field:</strong> ${card.field}</li>
    <li><strong>Born:</strong> ${card.born}</li>
    <li><strong>Country:</strong> ${card.country}</li>
    <li><strong>Known For:</strong> ${card.known_for}</li>
    <li><strong>Fun Fact:</strong> ${card.fun_fact}</li>
    `;

    document.getElementById('modalQuote').textContent =
    `"${card.quote}"`;

    cardInner.classList.remove('flipped');

    modal.classList.add('active');

    document.body.style.overflow = 'hidden';
}

/* CLOSE */

function closeModal(){

    modal.style.animation =
    "fadeOutModal 0.25s ease";

    setTimeout(() => {

        modal.classList.remove('active');

        modal.style.animation = "";

        cardInner.classList.remove('flipped');

        document.body.style.overflow = '';

    },220);
}

/* FLIP */

document.getElementById('modalCardScene')
.addEventListener('click', () => {

    cardInner.classList.toggle('flipped');

    const flipped =
    cardInner.classList.contains('flipped');

    modalHint.innerHTML = flipped

    ?

    '<i class="fa-solid fa-rotate"></i> Click to flip back'

    :

    '<i class="fa-solid fa-rotate"></i> Flip to see more about this card';
});

/* CLOSE BTN */

document.getElementById('modalCloseBtn')
.addEventListener('click', closeModal);

/* OUTSIDE CLICK */

modal.addEventListener('click', (e) => {

    if(e.target === modal){
        closeModal();
    }
});

/* ESC */

document.addEventListener('keydown', (e) => {

    if(e.key === 'Escape'){
        closeModal();
    }
});

/* ==================================================
   3D TILT
================================================== */

const scene =
document.getElementById('modalCardScene');

scene.addEventListener('mousemove', (e) => {

    const rect =
    scene.getBoundingClientRect();

    const x =
    e.clientX - rect.left;

    const y =
    e.clientY - rect.top;

    const rotateY =
    ((x / rect.width) - 0.5) * 18;

    const rotateX =
    ((y / rect.height) - 0.5) * -18;

    scene.style.transform =
    `rotateX(${rotateX}deg)
    rotateY(${rotateY}deg)`;
});

scene.addEventListener('mouseleave', () => {

    scene.style.transform =
    'rotateX(0deg) rotateY(0deg)';
});

/* ==================================================
   FILTER
================================================== */

function filterCards(type, btn){

    activeFilter = type;

    document.querySelectorAll('.filter-btn')
    .forEach(b =>
    b.classList.remove('active'));

    btn.classList.add('active');

    renderCards();
}

/* ==================================================
   INIT
================================================== */

loadUserXP();

</script>
