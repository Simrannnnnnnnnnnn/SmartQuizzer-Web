<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Quiz | SmartQuizzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary-gold: #FFD700; --text-color: #2d3436; }

        body { 
            background-color: #f8f9fa; 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .glass-card { 
            background: white; 
            border-radius: 24px; 
            border: 1px solid #eee; 
        }

        .option-card { 
            border: 2px solid #eee; 
            background-color: #ffffff; 
            transition: all 0.2s; 
            cursor: pointer; 
            color: #333; 
            border-radius: 16px !important;
        }

        .option-card:hover { 
            border-color: #FFD700; 
            background-color: #FFFDE7; 
            transform: translateY(-2px);
        }

        .btn-check:checked + .option-card { 
            border-color: #D4A017 !important; 
            background-color: #FFD700 !important; 
            color: #000 !important; 
            transform: translateY(-3px); 
            box-shadow: 0 4px 12px rgba(212,160,23,0.4) !important; 
        }

        .sunshine-btn { 
            background: var(--primary-gold); 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            color: black; 
            box-shadow: 0 5px 0 #D4A017; 
            transition: all 0.1s; 
            font-size: clamp(1rem, 3vw, 1.3rem);
        }

        .sunshine-btn:active { 
            transform: translateY(3px); 
            box-shadow: 0 2px 0 #D4A017; 
        }

        #ghost-bar { 
            transition: width 1s linear; 
            border-radius: 20px; 
        }

        /* Confidence buttons responsive */
        .confidence-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .confidence-group label {
            font-size: clamp(0.75rem, 2.5vw, 0.9rem);
            padding: 8px 16px;
            border-radius: 50px;
        }

        /* Option cards: 2 column on md+, 1 column on mobile */
        #options-container .option-label {
            display: block;
            width: 100%;
            padding: clamp(12px, 3vw, 18px) clamp(14px, 3vw, 20px);
            text-align: left;
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            font-weight: 700;
        }

        /* Mode badge responsive */
        #mode-badge {
            font-size: clamp(0.7rem, 2vw, 1rem);
        }

        /* Question text */
        #question-text {
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            line-height: 1.4;
        }

        /* Timer */
        #timer-box {
            font-size: clamp(1rem, 3vw, 1.5rem);
        }

        /* Feedback area */
        #feedback-area {
            font-size: clamp(0.85rem, 2.5vw, 1rem);
        }

        /* Container padding responsive */
        .quiz-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 16px;
        }

        @media (min-width: 576px) {
            .quiz-container { padding: 24px 20px; }
        }

        @media (min-width: 768px) {
            .quiz-container { padding: 32px 20px; }
        }

        /* Ghost bar section */
        #ghost-container {
            max-width: 760px;
            margin: 0 auto 16px;
            padding: 0 16px;
        }
    </style>
</head>
<body>

<div id="ghost-container" class="d-none animate__animated animate__fadeInDown">
    <div class="d-flex justify-content-between small fw-bold mb-1">
        <span>You 🏃</span>
        <span class="text-danger">AI Rival 👻</span>
    </div>
    <div class="progress rounded-pill shadow-sm" style="height: 14px; background: #eee; border: 2px solid #fff;">
        <div id="ghost-bar" class="progress-bar bg-danger" style="width: 0%;"></div>
    </div>
</div>

<div class="quiz-container">
    <div class="glass-card shadow-lg p-3 p-sm-4 p-md-5">

        <!-- Top bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 gap-2">
            <span id="mode-badge" class="badge px-3 py-2 rounded-pill shadow-sm">MODE</span>
            <div id="timer-box" class="mb-0 text-danger fw-bold d-none">⏳ <span id="timer">30</span>s</div>
        </div>

        <!-- Progress -->
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-end mb-1">
                <h5 class="fw-bold mb-0" style="font-size: clamp(0.85rem, 2.5vw, 1.1rem);">
                    Question <span id="current-q-num">1</span>
                    <span class="text-muted" style="font-size: 0.85em;">of <span id="total-q-num">10</span></span>
                </h5>
                <span id="progress-percent" class="small fw-bold text-primary">0%</span>
            </div>
            <div class="progress" style="height: 8px; border-radius: 10px;">
                <div id="main-progress-bar" class="progress-bar bg-primary progress-bar-striped progress-bar-animated" style="width: 0%;"></div>
            </div>
        </div>

        <hr class="mb-4 opacity-10">

        <!-- Question -->
        <h2 id="question-text" class="fw-bold mb-4">Loading question...</h2>

        <!-- Feedback -->
        <div id="feedback-area" class="alert d-none mb-4 rounded-4 shadow-sm animate__animated animate__bounceIn" style="border-left: 8px solid;">
            <h5 id="feedback-status" class="fw-bold mb-1"></h5>
            <p id="explanation-text" class="mb-0"></p>
        </div>

        <!-- Options -->
        <form id="quiz-form">
            <div id="options-container" class="row g-2 g-sm-3"></div>

            <!-- Confidence -->
            <div class="mt-4 p-3 p-md-4 rounded-4 text-center" style="background: #FFF9E6; border: 2px dashed #D4A017;">
                <p class="small fw-bold text-muted mb-2">HOW CONFIDENT ARE YOU?</p>
                <div class="confidence-group">
                    <input type="radio" class="btn-check" name="confidence" value="low" id="c1">
                    <label class="btn btn-outline-secondary rounded-pill" for="c1">😬 Unsure</label>
                    <input type="radio" class="btn-check" name="confidence" value="medium" id="c2" checked>
                    <label class="btn btn-outline-secondary rounded-pill" for="c2">🤔 Guess</label>
                    <input type="radio" class="btn-check" name="confidence" value="high" id="c3">
                    <label class="btn btn-outline-secondary rounded-pill" for="c3">😎 Expert</label>
                </div>
            </div>

            <!-- Action button -->
            <div class="mt-4">
                <button type="button" id="action-btn" class="sunshine-btn w-100 py-3">Lock In Answer 🔒</button>
            </div>
        </form>
    </div>
</div>

<script>
    const BACKEND_URL = "https://simrankaurrrrrr-smartquizzer-backend.hf.space";

    localStorage.removeItem('current_q_index');
    localStorage.removeItem('user_answers_pool');

    let questions = JSON.parse(localStorage.getItem('quiz_questions')) || [];
    let currentIndex = 0;
    let userAnswers = [];
    const quizGoal = localStorage.getItem('quiz_goal') || 'quiz';
    let timeLeft = 30;
    let timerInterval;

    function initQuiz() {
        if (questions.length === 0) {
            alert("No questions found! Please generate a quiz first.");
            window.location.href = "study_hub_result.html";
            return;
        }
        if (currentIndex >= questions.length) {
            calculateAndRedirect();
            return;
        }

        const q = questions[currentIndex];

        document.getElementById('mode-badge').innerText = quizGoal.toUpperCase() + " MODE";
        document.getElementById('mode-badge').className = `badge px-3 py-2 rounded-pill shadow-sm ${quizGoal === 'quiz' ? 'bg-danger' : 'bg-warning text-dark'}`;
        document.getElementById('current-q-num').innerText = currentIndex + 1;
        document.getElementById('total-q-num').innerText = questions.length;
        document.getElementById('question-text').innerText = q.question;

        const progress = ((currentIndex + 1) / questions.length) * 100;
        document.getElementById('main-progress-bar').style.width = progress + "%";
        document.getElementById('progress-percent').innerText = Math.round(progress) + "%";

        const container = document.getElementById('options-container');
        container.innerHTML = Object.entries(q.options).map(([key, val]) => `
            <div class="col-12 col-sm-6">
                <input type="radio" class="btn-check" name="answer" value="${key}" id="opt-${key}">
                <label class="btn option-card option-label" for="opt-${key}">
                    <span class="text-warning me-2">${key}.</span> ${val}
                </label>
            </div>
        `).join('');

        if (quizGoal === 'quiz') {
            document.getElementById('ghost-container').classList.remove('d-none');
            document.getElementById('timer-box').classList.remove('d-none');
            startTimer();
        } else {
            document.getElementById('ghost-container').classList.add('d-none');
            document.getElementById('timer-box').classList.add('d-none');
        }

        const btn = document.getElementById('action-btn');
        btn.innerText = quizGoal === 'revision' ? "Check Answer ✅" : "Lock In Answer 🔒";
        btn.style.background = "#FFD700";
        btn.onclick = () => handleSubmission(false);
    }

    function startTimer() {
        timeLeft = 30;
        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('ghost-bar').style.width = "0%";
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('ghost-bar').style.width = ((30 - timeLeft) / 30 * 100) + "%";
            if (timeLeft <= 0) handleSubmission(true);
        }, 1000);
    }

    async function handleSubmission(isTimeout = false) {
        clearInterval(timerInterval);
        const selected = document.querySelector('input[name="answer"]:checked');
        const ansValue = isTimeout ? null : selected?.value;

        if (!isTimeout && !selected) {
            alert("Please select an answer!");
            return;
        }

        const q = questions[currentIndex];
        const isCorrect = ansValue === q.correct_answer;

        userAnswers.push({
            question: q.question,
            user_ans: ansValue ? (q.options[ansValue] || ansValue) : "Time Out",
            correct_ans: q.options[q.correct_answer] || q.correct_answer,
            is_correct: isCorrect,
            explanation: q.explanation || ''
        });

        if (quizGoal === 'revision') {
            showFeedback(isCorrect, q);
        } else {
            nextQuestion();
        }
    }

    function showFeedback(isCorrect, q) {
        const area = document.getElementById('feedback-area');
        area.classList.remove('d-none', 'alert-success', 'alert-danger');
        area.classList.add(isCorrect ? 'alert-success' : 'alert-danger');
        document.getElementById('feedback-status').innerText = isCorrect ? "✨ Correct!" : "❌ Incorrect";
        document.getElementById('explanation-text').innerText = q.explanation || '';

        const btn = document.getElementById('action-btn');
        btn.innerText = currentIndex + 1 >= questions.length ? "See Results 🏆" : "Next Question →";
        btn.style.background = "#333";
        btn.style.color = "white";
        btn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentIndex++;
        document.getElementById('feedback-area').classList.add('d-none');
        const btn = document.getElementById('action-btn');
        btn.style.color = "black";
        initQuiz();
    }

    async function calculateAndRedirect() {
        const correctCount = userAnswers.filter(a => a.is_correct).length;
        const topic = localStorage.getItem('quiz_topic') || 'General';
        const xp = correctCount * 10;

        localStorage.setItem('lastQuizResult', JSON.stringify({
            topic: topic,
            score: correctCount,
            total: questions.length,
            user_answers: userAnswers
        }));

        try {
            await fetch(`${BACKEND_URL}/save-result`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ score: correctCount, total: questions.length, topic: topic, xp: xp })
            });
        } catch (e) {
            console.error('XP save failed:', e);
        }

        window.location.href = "results.html";
    }

    initQuiz();
</script>
</body>
</html>
