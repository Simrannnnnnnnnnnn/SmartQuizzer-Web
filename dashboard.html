<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunshine Dashboard | SmartQuizzer AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --sun: #FFCC00; --warm-bg: #FFFDF5; --xp-purple: #8e44ad; }
        body { background-color: var(--warm-bg) !important; font-family: 'Inter', sans-serif; }
        .sun-nav { background: white; border-bottom: 3px solid #FFF4CC; padding: 12px 0; }
        .nav-link-custom { font-weight: 700; color: #444 !important; margin: 0 12px; text-decoration: none; transition: 0.3s; font-size: 0.95rem; }
        .nav-link-custom:hover { color: var(--sun) !important; transform: translateY(-2px); }
        .nav-link-custom i { color: var(--sun); margin-right: 5px; }
        
        .sunshine-card { background: #ffffff; border-radius: 30px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .sunshine-input { background: #ffffff !important; border: 2px solid #fff4cc !important; border-radius: 15px !important; }
        .sunshine-input:focus { border-color: var(--sun) !important; box-shadow: 0 0 15px rgba(255, 204, 0, 0.2) !important; }
        
        .sunshine-outline { border: 2px solid var(--sun) !important; color: #b89600 !important; background: transparent; }
        .btn-check:checked + .sunshine-outline { background: var(--sun) !important; color: white !important; }
        
        .sunshine-main-btn { background: linear-gradient(45deg, #ffcc00, #ffb800) !important; color: white !important; border: none !important; border-radius: 20px !important; transition: 0.3s; font-size: 1.1rem; }
        .sunshine-main-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 184, 0, 0.4) !important; }
        
        .streak-badge { background: white; border: 1px solid #eee; padding: 8px 20px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* Progress Bar Animation */
        .xp-progress-container { background: #f8f9fa; border-radius: 15px; height: 12px; margin-top: 10px; overflow: hidden; border: 1px solid #eee; }
        .xp-progress-bar { background: linear-gradient(90deg, #FFCC00 0%, #FF9800 100%); height: 100%; width: 0%; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .icon-box { transition: 0.3s; }
        .sunshine-card:hover .icon-box { transform: rotate(15deg) scale(1.1); }
    </style>
</head>
<body>

<nav class="sun-nav sticky-top mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="dashboard.html" class="navbar-brand fw-bold fs-3" style="color: var(--sun); text-decoration: none;">SmartQuizzer ☀️</a>
        <div class="d-none d-md-flex align-items-center">
            <a href="dashboard.html" class="nav-link-custom"><i class="fa-solid fa-house"></i> Home</a>
            <a href="study_hub.html" class="nav-link-custom"><i class="fa-solid fa-graduation-cap"></i> Study Hub</a>
            <a href="review.html" class="nav-link-custom"><i class="fa-solid fa-brain"></i> Mistakes</a>
            <a href="https://simrankaurrrrrr-smartquizzer-backend.hf.space/logout" class="nav-link-custom text-danger ms-3"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row mb-4 animate__animated animate__fadeIn">
        <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h2 class="fw-bold mb-0" style="color: #4b4b4b;">Rise & Study! ☀️</h2>
                <p class="text-muted fw-medium">Welcome back, <b id="username-display" class="text-warning">Student</b></p>
            </div>
            <div class="streak-badge d-flex align-items-center animate__animated animate__pulse animate__infinite">
                <i class="fa-solid fa-fire text-danger fs-4 me-2"></i>
                <span class="fw-bold fs-5" id="streak-display">0 Day Streak</span>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="sunshine-card p-4 p-md-5 animate__animated animate__fadeInLeft">
                <div class="d-flex align-items-center mb-4">
                    <div class="icon-box me-3 rounded-circle d-flex align-items-center justify-content-center" style="background: #fff9db; width: 60px; height: 60px;">
                        <i class="fa-solid fa-wand-magic-sparkles fs-3" style="color: #ffcc00;"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">AI Quiz Engine</h4>
                        <p class="text-muted small mb-0">Convert anything into a quiz in seconds</p>
                    </div>
                </div>

                <form id="quiz-form" enctype="multipart/form-data">
                    <div class="mb-4">
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="quiz_goal" id="rev" value="revision" checked>
                                <label class="btn sunshine-outline w-100 py-3 rounded-4 fw-bold" for="rev">
                                    <i class="fa-solid fa-leaf me-2"></i>Light Revision
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="quiz_goal" id="qz" value="quiz">
                                <label class="btn sunshine-outline w-100 py-3 rounded-4 fw-bold" for="qz" style="border-color: #ff7675 !important; color: #ff7675 !important;">
                                    <i class="fa-solid fa-fire me-2"></i>Deep Test
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ms-2">INPUT SOURCE</label>
                            <select name="source_type" id="source-select" class="form-select sunshine-input p-3 fw-bold">
                                <option value="topic">🌐 Explore a Topic</option>
                                <option value="pdf">📄 Smart PDF Upload</option>
                                <option value="image">📸 Scan Image (OCR)</option>
                                <option value="text">✍️ Quick Text Paste</option>
                                <option value="mistake">🧠 Mistake Bank Review</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted ms-2">QUESTION COUNT</label>
                            <input type="range" name="count" class="form-range mt-2" id="countRange" min="1" max="15" value="5" oninput="countOutput.innerText = value">
                            <div class="d-flex justify-content-between text-muted extra-small fw-bold">
                                <span>1</span><span id="countOutput" class="text-warning fs-5">5</span><span>15</span>
                            </div>
                        </div>
                    </div>

                    <div id="input-area" class="mt-4">
                        <input type="text" name="topic_name" id="topicInput" class="form-control sunshine-input p-4 rounded-pill" placeholder="Enter topic (e.g. Artificial Intelligence)..." required>
                    </div>

                    <div class="mt-5 d-flex gap-3">
                        <button type="submit" class="btn sunshine-main-btn flex-grow-1 py-3 fw-bold shadow-sm" id="submitBtn">
                            Generate Questions Now 🪄
                        </button>
                        <button type="button" id="caseBtn" class="btn btn-dark px-4 rounded-4 fw-bold shadow-sm" title="Start AI Case Challenge">
                            <i class="fa-solid fa-brain fs-5"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="sunshine-card p-4 mb-4 animate__animated animate__fadeInRight" style="border-left: 6px solid var(--sun);">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold text-muted mb-0">STUDENT LEVEL</h6>
                    <span class="badge rounded-pill bg-dark px-3" id="level-badge">Lvl 1</span>
                </div>
                <h3 class="fw-bold mb-1" id="total-xp-display">0 XP</h3>
                <div class="xp-progress-container">
                    <div class="xp-progress-bar" id="xp-bar"></div>
                </div>
                <p class="extra-small text-muted mt-2 mb-0 fw-bold" id="xp-to-next">Loading progress...</p>
            </div>

            <div class="sunshine-card p-4 mb-4 text-white animate__animated animate__fadeInRight" style="background: linear-gradient(135deg, #FF9800, #FF5722); border-radius: 30px;">
                <h6 class="fw-bold opacity-75">MASTERED QUESTIONS</h6>
                <h2 class="fw-bold display-5" id="correct-total">0</h2>
                <p class="small mb-0">Total across all topics</p>
            </div>

            <div class="sunshine-card p-4 text-center animate__animated animate__fadeInRight" style="border: 2px solid #fff4cc;">
                <h2 class="display-4 fw-bold" style="color: #ffcc00;" id="mistake-count">0</h2>
                <p class="text-muted fw-bold mb-3">Mistakes in Bank</p>
                <a href="review.html" class="btn btn-warning w-100 rounded-pill fw-bold shadow-sm py-2">Review Now</a>
            </div>
        </div>
    </div>
</div>

<script>
const BACKEND_URL = "https://simrankaurrrrrr-smartquizzer-backend.hf.space";

// 1. DYNAMIC STATS LOADING
async function loadStats() {
    try {
        const res = await fetch(`${BACKEND_URL}/api/dashboard_stats`, { credentials: 'include' });
        const data = await res.json();
        
        if (data.success) {
            document.getElementById('username-display').innerText = data.username || 'Student';
            document.getElementById('streak-display').innerText = `${data.streak || 0} Day Streak`;
            document.getElementById('correct-total').innerText = data.correct_total || 0;
            document.getElementById('mistake-count').innerText = data.mistake_count || 0;
            
            // Level Logic (500 XP per level)
            const totalXp = data.total_xp || 0;
            const level = Math.floor(totalXp / 500) + 1;
            const xpInCurrentLevel = totalXp % 500;
            const progressPercent = (xpInCurrentLevel / 500) * 100;
            const xpLeft = 500 - xpInCurrentLevel;

            document.getElementById('total-xp-display').innerText = `${totalXp} XP`;
            document.getElementById('level-badge').innerText = `Lvl ${level}`;
            document.getElementById('xp-bar').style.width = `${progressPercent}%`;
            document.getElementById('xp-to-next').innerText = `${xpLeft} XP to Level ${level + 1}`;
        }
    } catch(e) { 
        console.error('Stats load failed:', e);
    }
}
loadStats();

// 2. SOURCE TOGGLER (Improved UX)
document.getElementById('source-select').onchange = function() {
    const area = document.getElementById('input-area');
    const val = this.value;
    area.className = "mt-4 animate__animated animate__fadeIn";
    
    if (val === 'topic') {
        area.innerHTML = `<input type="text" name="topic_name" id="topicInput" class="form-control sunshine-input p-4 rounded-pill" placeholder="Enter topic (e.g. Photosynthesis)..." required>`;
    } else if (val === 'pdf') {
        area.innerHTML = `<div class="p-4 text-center rounded-4 border-2 shadow-sm" style="background: #fffef0; border: 2px dashed #ffe082;">
                            <i class="fa-solid fa-file-pdf fa-2x text-warning mb-2"></i>
                            <p class="text-muted small fw-bold">Select PDF Document</p>
                            <input type="file" name="pdf_file" id="activeFileInput" class="form-control" accept=".pdf" required>
                          </div>`;
    } else if (val === 'image') {
        area.innerHTML = `<div class="p-4 text-center rounded-4 border-2 shadow-sm" style="background: #fffef0; border: 2px dashed #ffcc00;">
                            <i class="fa-solid fa-image fa-2x text-warning mb-2"></i>
                            <p class="text-muted small fw-bold">Select Study Image</p>
                            <input type="file" name="image_file" id="activeFileInput" class="form-control" accept="image/*" required>
                          </div>`;
    } else if (val === 'text') {
        area.innerHTML = `<textarea name="raw_text" id="textInput" class="form-control sunshine-input p-4" rows="5" placeholder="Paste your notes here..." required></textarea>`;
    } else if (val === 'mistake') {
        area.innerHTML = `<div class="alert alert-warning border-0 rounded-4 fw-bold"><i class="fa-solid fa-lightbulb me-2"></i>AI will generate a quiz based on your previous mistakes.</div>`;
    }
};

// 3. FORM SUBMISSION
document.getElementById('quiz-form').onsubmit = async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const formData = new FormData(this);
    
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Creating your Quiz...`;
    btn.disabled = true;

    try {
        const response = await fetch(`${BACKEND_URL}/handle_generation`, {
            method: "POST",
            body: formData,
            credentials: 'include'
        });
        const res = await response.json();
        
        if (res.success) {
            localStorage.setItem('quiz_questions', JSON.stringify(res.questions));
            localStorage.setItem('quiz_topic', res.topic);
            localStorage.setItem('current_q_index', '0');
            localStorage.setItem('user_answers_pool', '[]');
            window.location.href = "quiz.html";
        } else {
            alert(res.message || "Failed to generate quiz.");
        }
    } catch (err) {
        alert("Connection failed. Check your internet.");
    } finally {
        btn.innerHTML = "Generate Questions Now 🪄";
        btn.disabled = false;
    }
};

// 4. CASE STUDY CHALLENGE
document.getElementById('caseBtn').onclick = async function() {
    const topic = document.getElementById('topicInput')?.value || "General Knowledge";
    this.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    
    try {
        const response = await fetch(`${BACKEND_URL}/start-challenge`, {
            method: "POST",
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ content_to_study: topic })
        });
        const res = await response.json();
        if (res.success) window.location.href = res.redirect;
    } catch(e) { alert("Error starting challenge."); }
    finally { this.innerHTML = '<i class="fa-solid fa-brain"></i>'; }
};
</script>
</body>
</html>
