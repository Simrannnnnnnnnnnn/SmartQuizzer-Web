<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Analytics | SmartQuizzer</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --primary-gold: #FFCC00; 
            --dark-grey: #2d3436; 
            --xp-green: #4CAF50;
        }

        body { 
            background-color: #f8f9fa; 
            font-family: 'Inter', sans-serif; 
        }

        /* ── Buttons ── */
        .sunshine-main-btn { 
            background: var(--primary-gold); 
            color: var(--dark-grey); 
            font-weight: bold; 
            border: none;
            transition: 0.3s;
        }
        .sunshine-main-btn:hover { 
            background: #e6b800; 
            transform: translateY(-2px); 
            color: var(--dark-grey); 
        }
        .sunshine-main-btn:disabled {
            opacity: 0.7;
            transform: none;
            cursor: not-allowed;
        }

        /* ── Cards ── */
        .card { border-radius: 28px; }

        /* ── XP Badge ── */
        .xp-badge-container { text-align: center; margin-bottom: 28px; }
        .xp-card {
            background: linear-gradient(135deg, #fff 0%, #fffef0 100%);
            border: 2px solid var(--primary-gold);
            border-radius: 20px;
            display: inline-block;
            padding: 14px 36px;
            box-shadow: 0 10px 25px rgba(255, 204, 0, 0.2);
        }
        .xp-value { 
            font-size: clamp(1.5rem, 5vw, 2rem); 
            font-weight: 800; 
            color: var(--dark-grey); 
            display: block; 
        }
        .xp-label { 
            font-size: 0.8rem; 
            font-weight: bold; 
            color: var(--xp-green); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        /* ── AI Insight ── */
        .ai-card {
            background: linear-gradient(135deg, #fff9e6 0%, #ffffff 100%);
            border-left: 6px solid var(--primary-gold) !important;
        }

        /* ── Toast ── */
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            z-index: 9999;
            font-size: 0.88rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
            white-space: nowrap;
        }
        @keyframes slideUp { 
            from { opacity:0; transform: translateX(-50%) translateY(20px); } 
            to   { opacity:1; transform: translateX(-50%) translateY(0); } 
        }

        /* ── Quiz Loader Overlay ── */
        #quiz-loader {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.93);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        #quiz-loader.show { display: flex; }

        /* ── Review cards ── */
        .review-card {
            border-radius: 20px !important;
        }
        .review-card .q-text {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
        }

        /* ── RESPONSIVENESS ── */

        /* Header */
        .results-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .results-header h1 {
            font-size: clamp(1.3rem, 4vw, 2rem);
        }
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-actions .btn {
            font-size: clamp(0.78rem, 2vw, 0.95rem);
            padding: 8px 18px;
        }

        /* Chart containers */
        .chart-box {
            position: relative;
            width: 100%;
            height: clamp(160px, 22vw, 200px);
        }

        /* Bottom CTA */
        .cta-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 40px;
            margin-bottom: 12px;
        }
        .cta-section .btn {
            width: 100%;
            max-width: 360px;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            padding: 14px 24px;
        }

        /* Review answer boxes */
        .answer-boxes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .answer-boxes > div {
            flex: 1 1 200px;
            min-width: 0;
        }

        @media (max-width: 576px) {
            .container { padding-left: 12px; padding-right: 12px; }
            .card > .p-4, .card > .p-md-5 { padding: 16px !important; }
            .xp-card { padding: 12px 24px; }
        }

        @media print { 
            .no-print { display: none !important; }
            .card { box-shadow: none !important; }
        }
    </style>
</head>
<body>

<!-- Quiz Loader Overlay -->
<div id="quiz-loader">
    <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;"></div>
    <h5 class="fw-bold text-dark">Generating fresh questions...</h5>
    <p class="text-muted small">Same topic, brand new quiz 🧠</p>
</div>

<div class="container py-4 py-md-5">
    <div class="card border-0 shadow-sm mx-auto mb-4 animate__animated animate__fadeIn" style="max-width: 960px; background: white; overflow: hidden;">

        <div class="p-3 p-sm-4 p-md-5">

            <!-- Header -->
            <div class="results-header">
                <div>
                    <h1 class="fw-bold m-0" style="color: var(--dark-grey);">Performance Analytics ☀️</h1>
                    <p class="text-muted mb-0 fw-medium mt-1">Topic: <span id="display-topic" class="text-dark fw-bold">Loading...</span></p>
                </div>
                <div class="header-actions no-print">
                    <button onclick="window.print()" class="btn btn-outline-danger rounded-pill fw-bold border-2 shadow-sm">
                        <i class="fas fa-file-pdf me-1 me-sm-2"></i><span class="d-none d-sm-inline">Print </span>Report
                    </button>
                    <a href="dashboard.html" class="sunshine-main-btn btn rounded-pill shadow-sm">
                        <i class="fas fa-home me-1 me-sm-2"></i><span class="d-none d-sm-inline">Dashboard</span><span class="d-sm-none">Home</span>
                    </a>
                </div>
            </div>

            <!-- XP Badge -->
            <div class="xp-badge-container animate__animated animate__zoomIn">
                <div class="xp-card">
                    <i class="fas fa-crown text-warning mb-1"></i>
                    <span class="xp-value" id="xp-gained-display">+0</span>
                    <span class="xp-label"><i class="fas fa-bolt me-1"></i> XP Gained</span>
                </div>
            </div>

            <!-- Charts -->
            <div class="row g-3 g-md-4 mb-4 mb-md-5">
                <div class="col-sm-5">
                    <div class="p-3 p-md-4 rounded-4 text-center h-100 border-0 shadow-sm d-flex align-items-center justify-content-center" style="background: #fffef0;">
                        <div style="position: relative; width: 100%;">
                            <div class="chart-box">
                                <canvas id="accuracyPie"></canvas>
                            </div>
                            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;">
                                <h3 id="accuracy-text" class="fw-bold m-0" style="font-size: clamp(1rem, 4vw, 1.5rem);">0%</h3>
                                <small class="text-muted fw-bold" style="font-size: 0.65rem;">ACCURACY</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-7">
                    <div class="p-3 p-md-4 rounded-4 h-100 border-0 shadow-sm" style="background: #f1f2f6;">
                        <h6 class="fw-bold mb-3 text-dark">Score Distribution</h6>
                        <div class="chart-box">
                            <canvas id="scoreBar"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI Coach -->
            <div class="card ai-card border-0 shadow-sm rounded-4 mb-4 mb-md-5 animate__animated animate__fadeInUp">
                <div class="card-body p-3 p-md-4">
                    <h5 class="fw-bold text-dark"><i class="fas fa-robot me-2 text-warning"></i>AI Personal Coach</h5>
                    <div id="ai-insight-content" class="mt-2">
                        <p class="text-muted mb-0">Analyzing your learning patterns...</p>
                    </div>
                </div>
            </div>

            <!-- Review -->
            <h4 class="fw-bold mb-3 mt-4">Detailed Review 📝</h4>
            <div id="review-container"></div>

            <!-- CTA Buttons -->
            <div class="cta-section no-print">
                <!-- ✅ FIXED: Same topic, fresh questions -->
                <button 
                    id="new-quiz-btn"
                    onclick="takeNewQuiz()" 
                    class="sunshine-main-btn btn btn-lg rounded-pill shadow animate__animated animate__pulse animate__infinite">
                    🚀 Take New Quiz (Same Topic)
                </button>
                <a href="study_hub_result.html" class="btn btn-outline-dark rounded-pill shadow-sm">
                    ← Back to Study Bundle
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://simrankaurrrrrr-smartquizzer-backend.hf.space";

    // ── Toast ──────────────────────────────────────────────────────
    function showToast(msg, duration = 3500) {
        const existing = document.querySelector('.toast-msg');
        if (existing) existing.remove();
        const t = document.createElement('div');
        t.className = 'toast-msg';
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), duration);
    }

    // ── Page Init ─────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        const quizResult = JSON.parse(localStorage.getItem('lastQuizResult'));

        if (!quizResult) {
            showToast("No quiz data found! Redirecting...");
            setTimeout(() => window.location.href = "dashboard.html", 1500);
            return;
        }

        const score      = quizResult.score || 0;
        const total      = quizResult.total || 0;
        const accuracy   = total > 0 ? Math.round((score / total) * 100) : 0;
        const topic      = quizResult.topic || 'General';
        const userAnswers = quizResult.user_answers || [];

        document.getElementById('display-topic').innerText = topic;
        document.getElementById('accuracy-text').innerText = `${accuracy}%`;

        let xpGained = score * 10;
        if (accuracy === 100) xpGained += 50;
        document.getElementById('xp-gained-display').innerText = `+${xpGained}`;

        initCharts(score, total);
        renderReview(userAnswers, topic);
        generateAIAnalysis(userAnswers, topic, accuracy);
        syncXPWithBackend(score, total, topic, xpGained);
    });

    // ── AI Coach ──────────────────────────────────────────────────
    function generateAIAnalysis(answers, topic, accuracy) {
        const insightDiv = document.getElementById('ai-insight-content');
        const incorrectCount = answers.filter(a => !a.is_correct).length;

        let feedback = '';
        if (accuracy === 100) {
            feedback = `<p class="mb-0 text-dark">🌟 <b>Perfect Score!</b> You have mastered <b>${topic}</b>. Try a harder quiz or teach someone else!</p>`;
        } else if (accuracy >= 70) {
            feedback = `<p class="mb-0 text-dark">👍 <b>Great Job!</b> You understand the core concepts but missed ${incorrectCount} question${incorrectCount > 1 ? 's' : ''}. Re-read the explanations below to seal those gaps.</p>`;
        } else if (accuracy >= 40) {
            feedback = `<p class="mb-0 text-dark">📖 <b>Keep Going!</b> You got some basics right on <b>${topic}</b> but there's room to grow. Review your study bundle and try the quiz again.</p>`;
        } else {
            feedback = `<p class="mb-0 text-dark">📚 <b>Room for Growth:</b> <b>${topic}</b> needs more attention. Go back to your Study Bundle, re-read the shorthand notes, and then take a fresh quiz!</p>`;
        }
        insightDiv.innerHTML = feedback;
    }

    // ── Review ────────────────────────────────────────────────────
    function renderReview(answers, topic) {
        const container = document.getElementById('review-container');

        if (!answers || answers.length === 0) {
            container.innerHTML = `<p class="text-center text-muted">No review data available.</p>`;
            return;
        }

        container.innerHTML = answers.map((item, index) => `
            <div class="card review-card mb-3 border-0 shadow-sm overflow-hidden border-start border-4 ${item.is_correct ? 'border-success' : 'border-danger'}">
                <div class="card-body p-3 p-md-4">
                    <div class="d-flex justify-content-between mb-2 align-items-center">
                        <span class="badge ${item.is_correct ? 'bg-success' : 'bg-danger'} rounded-pill px-3">Q${index + 1}</span>
                        <span class="${item.is_correct ? 'text-success' : 'text-danger'} fw-bold small">
                            ${item.is_correct 
                                ? '<i class="fas fa-check-circle me-1"></i>Correct' 
                                : '<i class="fas fa-times-circle me-1"></i>Incorrect'}
                        </span>
                    </div>
                    <p class="fw-bold text-dark q-text mb-3">${item.question}</p>
                    <div class="answer-boxes">
                        <div class="p-2 rounded-3 bg-light border">
                            <small class="text-muted d-block fw-bold" style="font-size:0.7rem;">YOUR ANSWER</small>
                            <span class="${item.is_correct ? 'text-success' : 'text-danger'} fw-bold small">${item.user_ans || 'Skipped'}</span>
                        </div>
                        ${!item.is_correct ? `
                        <div class="p-2 rounded-3 bg-light border">
                            <small class="text-muted d-block fw-bold" style="font-size:0.7rem;">CORRECT ANSWER</small>
                            <span class="text-success fw-bold small">${item.correct_ans}</span>
                        </div>` : ''}
                    </div>
                    <div class="p-3 rounded-4" style="background:#fdfaf0; border:1px solid #f9f1d7;">
                        <p class="small mb-0 text-dark">
                            <strong><i class="fas fa-lightbulb me-2 text-warning"></i>Explanation:</strong> 
                            ${item.explanation || 'Review the key concepts of ' + topic}
                        </p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // ── Charts ────────────────────────────────────────────────────
    function initCharts(score, total) {
        const gold = '#FFCC00';
        const opts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };

        new Chart(document.getElementById('accuracyPie'), {
            type: 'doughnut',
            data: {
                datasets: [{ data: [score, total - score], backgroundColor: [gold, '#dee2e6'], borderWidth: 0 }]
            },
            options: { ...opts, cutout: '78%' }
        });

        new Chart(document.getElementById('scoreBar'), {
            type: 'bar',
            data: {
                labels: ['Correct ✅', 'Wrong ❌', 'Total'],
                datasets: [{
                    data: [score, total - score, total],
                    backgroundColor: [gold, '#ff7675', '#2d3436'],
                    borderRadius: 10
                }]
            },
            options: { 
                ...opts, 
                scales: { 
                    y: { beginAtZero: true, ticks: { stepSize: 1 } },
                    x: { ticks: { font: { size: 11 } } }
                } 
            }
        });
    }

    // ── XP Sync ───────────────────────────────────────────────────
    async function syncXPWithBackend(score, total, topic, xp) {
        try {
            await fetch(`${BACKEND_URL}/api/update_xp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ score, total_questions: total, topic, xp_gained: xp })
            });
        } catch (e) { console.error("XP Sync failed", e); }
    }

    // ── ✅ TAKE NEW QUIZ (FIXED) ───────────────────────────────────
    // Same topic, fresh questions from backend
    // Fallback: uses currentStudyData flashcards if backend is down
    async function takeNewQuiz() {
        const btn = document.getElementById('new-quiz-btn');
        const quizResult = JSON.parse(localStorage.getItem('lastQuizResult'));
        const studyData  = JSON.parse(localStorage.getItem('currentStudyData'));

        const topic   = quizResult?.topic || studyData?.topic || 'General';
        const content = studyData?.detailed_revision || studyData?.mnemonic_story || topic;

        // Show loader
        document.getElementById('quiz-loader').classList.add('show');
        btn.disabled = true;
        btn.classList.remove('animate__pulse', 'animate__infinite');

        try {
            const response = await fetch(`${BACKEND_URL}/generate-quiz`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: content,
                    topic: topic,
                    num_questions: 10
                })
            });

            if (!response.ok) throw new Error('Server error');
            const result = await response.json();

            if (result.questions && result.questions.length > 0) {
                // ✅ Fresh questions mil gaye — store & redirect
                localStorage.setItem('quiz_questions', JSON.stringify(result.questions));
                localStorage.setItem('quiz_topic', topic);
                localStorage.setItem('quiz_goal', 'quiz');
                window.location.href = 'quiz.html';
            } else {
                throw new Error('Empty questions');
            }

        } catch (e) {
            // ── FALLBACK: flashcards as quiz ─────────────────────
            if (studyData?.flashcards?.length > 0) {
                const fallback = studyData.flashcards.map(card => ({
                    question: card.front || card.question,
                    options: {
                        A: card.back || card.answer,
                        B: "Not applicable",
                        C: "None of the above",
                        D: "All of the above"
                    },
                    correct_answer: "A",
                    explanation: `The correct answer is: ${card.back || card.answer}`
                }));

                localStorage.setItem('quiz_questions', JSON.stringify(fallback));
                localStorage.setItem('quiz_topic', topic);
                localStorage.setItem('quiz_goal', 'revision');

                document.getElementById('quiz-loader').classList.remove('show');
                showToast("📚 Backend offline — using flashcard mode!");
                setTimeout(() => window.location.href = 'quiz.html', 1400);
            } else {
                document.getElementById('quiz-loader').classList.remove('show');
                btn.disabled = false;
                btn.classList.add('animate__pulse', 'animate__infinite');
                showToast("Quiz generation failed. Try again in a moment.");
            }
        }
    }
</script>

</body>
</html>
