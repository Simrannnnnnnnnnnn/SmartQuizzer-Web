<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Analytics | SmartQuizzer</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --primary-gold: #FFCC00; 
            --dark-grey: #2d3436; 
            --xp-green: #4CAF50;
        }
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        
        .sunshine-main-btn { 
            background: var(--primary-gold); 
            color: var(--dark-grey); 
            font-weight: bold; 
            border: none;
            transition: 0.3s;
        }
        .sunshine-main-btn:hover { background: #e6b800; transform: translateY(-2px); color: var(--dark-grey); }
        
        .card { border-radius: 35px; }

        /* XP System Styles */
        .xp-badge-container { text-align: center; margin-bottom: 30px; }
        .xp-card {
            background: linear-gradient(135deg, #fff 0%, #fffef0 100%);
            border: 2px solid var(--primary-gold);
            border-radius: 20px;
            display: inline-block;
            padding: 15px 40px;
            box-shadow: 0 10px 25px rgba(255, 204, 0, 0.2);
        }
        .xp-value { font-size: 2rem; font-weight: 800; color: var(--dark-grey); display: block; }
        .xp-label { font-size: 0.8rem; font-weight: bold; color: var(--xp-green); text-transform: uppercase; letter-spacing: 1px; }
        
        /* AI Insight Card */
        .ai-card {
            background: linear-gradient(135deg, #fff9e6 0%, #ffffff 100%);
            border-left: 6px solid var(--primary-gold) !important;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="card border-0 shadow-sm mx-auto mb-5 animate__animated animate__fadeIn" style="max-width: 1000px; background: white; overflow: hidden;">
        
        <div class="p-4 p-md-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h1 class="fw-bold m-0" style="color: var(--dark-grey);">Performance Analytics ☀️</h1>
                    <p class="text-muted mb-0 fw-medium">Topic: <span id="display-topic" class="text-dark fw-bold">AI Analysis</span></p>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="window.print()" class="btn btn-outline-danger rounded-pill px-4 fw-bold border-2 shadow-sm">
                        <i class="fas fa-file-pdf me-2"></i>Print Report
                    </button>
                    <a href="dashboard.html" class="sunshine-main-btn btn rounded-pill px-4 py-2 shadow-sm">Dashboard 🏠</a>
                </div>
            </div>

            <div class="xp-badge-container animate__animated animate__zoomIn">
                <div class="xp-card">
                    <i class="fas fa-crown text-warning mb-1"></i>
                    <span class="xp-value" id="xp-gained-display">+0</span>
                    <span class="xp-label"><i class="fas fa-bolt me-1"></i> XP Gained</span>
                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-md-5">
                    <div class="p-4 rounded-4 text-center h-100 border-0 shadow-sm d-flex align-items-center justify-content-center" style="background: #fffef0;">
                        <div style="position: relative; width: 100%; height: 180px;">
                            <canvas id="accuracyPie"></canvas>
                            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                                <h2 id="accuracy-text" class="fw-bold m-0">0%</h2>
                                <small class="text-muted fw-bold">ACCURACY</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-7">
                    <div class="p-4 rounded-4 h-100 border-0 shadow-sm" style="background: #f1f2f6;">
                        <h6 class="fw-bold mb-3 text-dark">Score Distribution</h6>
                        <div style="height: 180px; position: relative;"> 
                            <canvas id="scoreBar"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card ai-card border-0 shadow-sm rounded-4 mb-5 animate__animated animate__fadeInUp">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-dark"><i class="fas fa-robot me-2 text-warning"></i> AI Personal Coach</h4>
                    <div id="ai-insight-content" class="mt-3">
                        <p class="text-muted">Analyzing your learning patterns...</p>
                    </div>
                </div>
            </div>

            <h3 class="fw-bold mb-4 mt-5">Detailed Review 📝</h3>
            <div id="review-container"></div>

            <div class="text-center mt-5 mb-3">
                <a href="quiz_selection.html" class="sunshine-main-btn btn btn-lg rounded-pill px-5 py-3 shadow animate__animated animate__pulse animate__infinite">
                    Take New Quiz 🚀
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const quizResult = JSON.parse(localStorage.getItem('lastQuizResult'));
        
        if (!quizResult) {
            alert("No quiz data found! Redirecting to dashboard...");
            window.location.href = "dashboard.html";
            return;
        }

        const score = quizResult.score || 0;
        const total = quizResult.total || 0;
        const accuracy = total > 0 ? Math.round((score / total) * 100) : 0;
        const topic = quizResult.topic || 'General';
        const userAnswers = quizResult.user_answers || [];

        // Update UI
        document.getElementById('display-topic').innerText = topic;
        document.getElementById('accuracy-text').innerText = `${accuracy}%`;

        // XP Logic
        let xpGained = score * 10;
        if (accuracy === 100) xpGained += 50;
        document.getElementById('xp-gained-display').innerText = `+${xpGained}`;

        // Initialize Everything
        initCharts(score, total);
        renderReview(userAnswers);
        generateAIAnalysis(userAnswers, topic, accuracy);
        syncXPWithBackend(score, total, topic, xpGained);
    });

    function generateAIAnalysis(answers, topic, accuracy) {
        const insightDiv = document.getElementById('ai-insight-content');
        const incorrectCount = answers.filter(a => !a.is_correct).length;
        
        let feedback = "";
        if (accuracy === 100) {
            feedback = `<p class="mb-0 text-dark">🌟 <b>Perfect Score!</b> You have mastered <b>${topic}</b>. You're ready to teach others or try a more advanced level!</p>`;
        } else if (accuracy >= 70) {
            feedback = `<p class="mb-0 text-dark">👍 <b>Great Job!</b> You understand the core concepts. However, you missed ${incorrectCount} questions. 
            <b>Tip:</b> Re-check the explanations for the "Incorrect" questions below to clear minor doubts.</p>`;
        } else {
            feedback = `<p class="mb-0 text-dark">📚 <b>Room for Growth:</b> You struggled a bit with <b>${topic}</b>. 
            <b>AI Advice:</b> Focus on the fundamental concepts. I suggest retaking this quiz after reviewing the study material in your dashboard.</p>`;
        }
        insightDiv.innerHTML = feedback;
    }

    function renderReview(answers) {
        const container = document.getElementById('review-container');
        if (answers.length === 0) {
            container.innerHTML = `<p class="text-center text-muted">No review data available.</p>`;
            return;
        }

        container.innerHTML = answers.map((item, index) => `
            <div class="card mb-4 border-0 shadow-sm rounded-4 overflow-hidden border-start border-4 ${item.is_correct ? 'border-success' : 'border-danger'}">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge ${item.is_correct ? 'bg-success' : 'bg-danger'} rounded-pill">Q${index + 1}</span>
                        <span class="${item.is_correct ? 'text-success' : 'text-danger'} fw-bold small">
                            ${item.is_correct ? '<i class="fas fa-check-circle me-1"></i>Correct' : '<i class="fas fa-times-circle me-1"></i>Incorrect'}
                        </span>
                    </div>
                    <h5 class="fw-bold mb-3 text-dark">${item.question}</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <div class="p-2 rounded bg-light border">
                                <small class="text-muted d-block fw-bold">YOUR SELECTION</small>
                                <span class="${item.is_correct ? 'text-success' : 'text-danger'} fw-bold">${item.user_ans || 'Skipped'}</span>
                            </div>
                        </div>
                        ${!item.is_correct ? `
                        <div class="col-md-6">
                            <div class="p-2 rounded bg-light border">
                                <small class="text-muted d-block fw-bold">CORRECT ANSWER</small>
                                <span class="text-success fw-bold">${item.correct_ans}</span>
                            </div>
                        </div>` : ''}
                    </div>
                    <div class="p-3 rounded-4" style="background: #fdfaf0; border: 1px solid #f9f1d7;">
                        <p class="small mb-0 text-dark">
                            <strong><i class="fas fa-lightbulb me-2 text-warning"></i>Explanation:</strong> 
                            ${item.explanation || "Review the key concepts of " + document.getElementById('display-topic').innerText}
                        </p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function initCharts(score, total) {
        const primaryGold = '#FFCC00';
        const chartOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };

        new Chart(document.getElementById('accuracyPie'), {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [score, total - score],
                    backgroundColor: [primaryGold, '#dee2e6'],
                    borderWidth: 0
                }]
            },
            options: { ...chartOptions, cutout: '80%' }
        });

        new Chart(document.getElementById('scoreBar'), {
            type: 'bar',
            data: {
                labels: ['Correct', 'Wrong', 'Total'],
                datasets: [{
                    data: [score, total - score, total],
                    backgroundColor: [primaryGold, '#ff7675', '#2d3436'],
                    borderRadius: 10
                }]
            },
            options: { ...chartOptions, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
        });
    }

    async function syncXPWithBackend(score, total, topic, xp) {
        const BACKEND_URL = "https://simrankaurrrrrr-smartquizzer-backend.hf.space";
        try {
            await fetch(`${BACKEND_URL}/api/update_xp`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ score, total_questions: total, topic, xp_gained: xp })
            });
        } catch (e) { console.error("XP Sync failed", e); }
    }
</script>

</body>
</html>
