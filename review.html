<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistake Bank | SmartQuizzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --sun: #FFCC00; --warm-bg: #FFFDF5; }
        body { background-color: var(--warm-bg) !important; font-family: 'Inter', sans-serif; }
        .sun-nav { background: white; border-bottom: 3px solid #FFF4CC; padding: 12px 0; }
        .nav-link-custom { font-weight: 700; color: #444 !important; margin: 0 12px; text-decoration: none; transition: 0.3s; font-size: 0.95rem; }
        .nav-link-custom:hover { color: var(--sun) !important; }
        .nav-link-custom i { color: var(--sun); margin-right: 5px; }
        .sunshine-card { background: #ffffff; border-radius: 30px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: 0.3s; }
        .sunshine-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(255,204,0,0.15); }
        .sunshine-btn { background: linear-gradient(45deg, #ffcc00, #ffb800); color: white; border: none; border-radius: 50px; font-weight: bold; padding: 10px 25px; text-decoration: none; display: inline-block; transition: 0.3s; }
        .sunshine-btn:hover { transform: translateY(-2px); color: white; }
        .correct-answer { background: #d1fae5 !important; border-color: #6ee7b7 !important; color: #065f46 !important; font-weight: bold; }
        .option-item { background: #fffdf5; border: 2px solid #fff4cc; border-radius: 15px; padding: 12px 18px; margin-bottom: 10px; display: flex; align-items: center; transition: 0.2s; }
    </style>
</head>
<body>

<nav class="sun-nav sticky-top mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="#" class="navbar-brand fw-bold fs-3" style="color: var(--sun); text-decoration: none;">SmartQuizzer ☀️</a>
        <div class="d-none d-md-flex align-items-center">
            <a href="dashboard.html" class="nav-link-custom"><i class="fa-solid fa-house"></i> Home</a>
            <a href="study_hub.html" class="nav-link-custom"><i class="fa-solid fa-graduation-cap"></i> Study Hub</a>
            <a href="library.html" class="nav-link-custom"><i class="fa-solid fa-folder-open"></i> Library</a>
            <a href="https://simrankaurrrrrr-smartquizzer-backend.hf.space/logout" class="nav-link-custom text-danger ms-3"><i class="fa-solid fa-power-off"></i></a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h2 class="fw-bold" style="color: #4b4b4b;">📝 Mistake Bank</h2>
            <p class="text-muted fw-medium">Review your weak spots and turn them into strengths.</p>
        </div>
        <a href="dashboard.html" class="btn btn-outline-secondary rounded-pill px-4 fw-bold shadow-sm">
            <i class="fa-solid fa-arrow-left me-2"></i>Back
        </a>
    </div>

    <div id="mistakes-container" class="row g-4">
        <div class="col-12 text-center py-5" id="loading-state">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-3 text-muted">Loading your mistakes...</p>
        </div>
    </div>

    <div id="empty-state" class="text-center py-5 d-none">
        <div class="sunshine-card p-5 mx-auto" style="max-width: 400px;">
            <i class="fa-solid fa-circle-check text-warning display-1 mb-3"></i>
            <h3 class="fw-bold">No Mistakes Found! 🎉</h3>
            <p class="text-muted">You're doing great! Keep quizzing!</p>
            <a href="dashboard.html" class="sunshine-btn mt-3">New Quiz 🚀</a>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://simrankaurrrrrr-smartquizzer-backend.hf.space";

    document.addEventListener('DOMContentLoaded', async function() {
        const container = document.getElementById('mistakes-container');
        const emptyState = document.getElementById('empty-state');
        const loadingState = document.getElementById('loading-state');

        try {
            const response = await fetch(`${BACKEND_URL}/review-mistakes`, {
                method: 'GET',
                credentials: 'include'
            });

            const data = await response.json();
            const mistakes = data.mistakes || [];
            loadingState.remove();

            if (mistakes.length === 0) {
                emptyState.classList.remove('d-none');
                container.innerHTML = "";
            } else {
                renderMistakes(mistakes);
            }
        } catch (error) {
            console.error("Error fetching mistakes:", error);
            loadingState.remove();
            container.innerHTML = `
                <div class="col-12">
                    <div class="sunshine-card p-5 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-warning display-4 mb-3"></i>
                        <h4 class="fw-bold">Please login first!</h4>
                        <a href="login.html" class="sunshine-btn mt-3">Login 🔐</a>
                    </div>
                </div>`;
        }
    });

    function renderMistakes(mistakes) {
        const container = document.getElementById('mistakes-container');
        container.innerHTML = mistakes.map((m, index) => `
            <div class="col-lg-6">
                <div class="sunshine-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span class="badge rounded-pill px-3 py-2 fw-bold" style="background: #fff4cc; color: #b8860b;">
                            <i class="fa-solid fa-tag me-1"></i> ${m.topic}
                        </span>
                        <small class="text-muted fw-bold">Mistake #${index + 1}</small>
                    </div>

                    <h5 class="fw-bold mb-4" style="color: #4b4b4b; line-height: 1.5;">${m.question}</h5>

                    <div class="mb-4">
                        ${Object.entries(m.options).map(([key, val]) => `
                            <div class="option-item ${key === m.correct_answer ? 'correct-answer' : ''}">
                                <span class="fw-bold me-3" style="width:28px; height:28px; display:flex; align-items:center; justify-content:center; background:#fff4cc; border-radius:50%; font-size:0.85rem; color:#b8860b; flex-shrink:0;">
                                    ${key}
                                </span>
                                <span>${val}</span>
                                ${key === m.correct_answer ? '<i class="fa-solid fa-check-circle ms-auto text-success"></i>' : ''}
                            </div>
                        `).join('')}
                    </div>

                    <button class="btn w-100 fw-bold rounded-pill py-2" 
                            style="background: #fff9db; border: 2px solid #ffcc00; color: #b8860b;"
                            onclick="toggleExpl('expl-${index}')">
                        <i class="fa-solid fa-lightbulb me-2"></i>Why did I get this wrong?
                    </button>
                    <div id="expl-${index}" class="d-none mt-3 p-3 rounded-4 animate__animated animate__fadeIn" 
                         style="background: #fffdf5; border-left: 4px solid #ffcc00;">
                        <p class="small mb-0" style="color: #4b4b4b; line-height: 1.6;">
                            <strong>AI Explanation:</strong> ${m.explanation || "Review the core concepts of " + m.topic}
                        </p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function toggleExpl(id) {
        document.getElementById(id).classList.toggle('d-none');
    }
</script>
</body>
</html>
